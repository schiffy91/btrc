# Compilation targets shared by both compilers (PLAN.md D21; Stage 24's
# docs/design/platform-target-contract.md). Generated catalogs are data-only;
# edit this file. A row is one artifact identity: OS, architecture,
# environment, deployment minimum, clang triple, data model and sysroot rule.
schema_version = 2

[aliases]
# Architecture spellings accepted beside the canonical ones.
architectures = { arm64 = "aarch64", x64 = "x86_64" }
# The environment a label without an environment suffix means.
default_environments = { linux = "gnu", windows = "gnu" }

# One row per target, in label order. The label is OS-ARCH, plus -ENVIRONMENT
# when the environment is not the OS's default; the generator checks it. The
# triple is clang's cc1 form (`-###`), with the deployment minimum in it;
# target_arguments are the clang arguments. Every value was read from clang
# 21.1.8 (`-dM -E`, `-###`).
[[targets]]
label = "android-aarch64"
operating_system = "android"
architecture = "aarch64"
environment = ""
minimum_version = "29"
triple = "aarch64-unknown-linux-android29"
triple_aliases = ["aarch64-linux-android29"]
zig_target = ""
target_arguments = ["--target=aarch64-unknown-linux-android29"]
sizeof_pointer = 8
sizeof_long = 8
sizeof_wchar_t = 4
sizeof_long_double = 16
char_signed = false
wchar_signed = false
sysroot_kind = "ndk"
sysroot_name = ""
compiler_host = false
objective_c = false
frameworks = false

