# clang defines _M_* only for the msvc environment, never for gnu. The row
# joined when both compilers began selecting rows by environment as well
# (Stage 24 commit 1c, platform-target-contract.md §1.3).
[[predefined_macros]]
name = "_M_ARM64"
value = 1
operating_systems = ["windows"]
architectures = ["aarch64"]
environments = ["msvc"]

# Sizes shared by every target. char, short, int and long long are pinned
# across rows; the data model comes from the row columns.
[[predefined_macros]]
name = "__CHAR_BIT__"
value = 8

[[predefined_macros]]
name = "__SIZEOF_SHORT__"
value = 2

[[predefined_macros]]
name = "__SIZEOF_INT__"
value = 4

[[predefined_macros]]
name = "__SIZEOF_LONG_LONG__"
value = 8

[[predefined_macros]]
name = "__SIZEOF_POINTER__"
value = 8

[[predefined_macros]]
name = "__SIZEOF_SIZE_T__"
value = 8

[[predefined_macros]]
name = "__SIZEOF_PTRDIFF_T__"
value = 8

# Byte order. clang spells __BYTE_ORDER__ as __ORDER_LITTLE_ENDIAN__; the
# table holds its value.
[[predefined_macros]]
name = "__ORDER_LITTLE_ENDIAN__"
value = 1234

[[predefined_macros]]
name = "__ORDER_BIG_ENDIAN__"
value = 4321

[[predefined_macros]]
name = "__ORDER_PDP_ENDIAN__"
value = 3412

[[predefined_macros]]
name = "__BYTE_ORDER__"
value = 1234

# The language standard btrc emits. clang does not define __STDC__ for the
# msvc environment, so #if __STDC__ reads 0 there, as in C.
[[predefined_macros]]
name = "__STDC__"
value = 1
environments = ["", "gnu", "simulator"]

[[predefined_macros]]
name = "__STDC_VERSION__"
value = 201112

