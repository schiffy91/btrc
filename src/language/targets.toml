# Target predefined macros (D20): with a file's own earlier #defines, the only
# names #if evaluates. Values are clang's at -std=c11 for each row's triple.
# An omitted selector selects every value; "" in environments names the empty
# environment. The data-model and deployment macros (__SIZEOF_LONG__,
# __SIZEOF_WCHAR_T__, __SIZEOF_LONG_DOUBLE__, __LP64__, _LP64,
# __CHAR_UNSIGNED__, __WCHAR_UNSIGNED__, __ANDROID_API__,
# __ANDROID_MIN_SDK_VERSION__ and the __ENVIRONMENT_*_VERSION_MIN_REQUIRED__
# names) are derived from the row columns and may not appear here.

# Operating system.
[[predefined_macros]]
name = "__ELF__"
value = 1
operating_systems = ["android", "linux"]

[[predefined_macros]]
name = "__linux"
value = 1
operating_systems = ["android", "linux"]

[[predefined_macros]]
name = "__linux__"
value = 1
operating_systems = ["android", "linux"]

[[predefined_macros]]
name = "__unix"
value = 1
operating_systems = ["android", "linux"]

[[predefined_macros]]
name = "__unix__"
value = 1
operating_systems = ["android", "linux"]

[[predefined_macros]]
name = "__ANDROID__"
value = 1
operating_systems = ["android"]

[[predefined_macros]]
name = "__APPLE__"
value = 1
operating_systems = ["ios", "macos"]

[[predefined_macros]]
name = "__MACH__"
value = 1
operating_systems = ["ios", "macos"]

[[predefined_macros]]
name = "__APPLE_EMBEDDED_SIMULATOR__"
value = 1
operating_systems = ["ios"]
environments = ["simulator"]

[[predefined_macros]]
name = "_WIN32"
value = 1
operating_systems = ["windows"]

[[predefined_macros]]
name = "_WIN64"
