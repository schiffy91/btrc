[conditionals]
# Reserved names that no target defines: #if reads 0 and defined() reads 0.
undefined_macro_names = ["__cplusplus"]
# Set by C headers or C compiler flags, never by btrc: #if refuses them and
# sources cannot #define or #undef them (M4). clang predefines no
# TARGET_CPU_*, TARGET_RT_* or TARGET_OS_BRIDGE name. The TARGET_OS_* names
# clang does define are predefined rows, which M3 refuses instead
# (platform-target-contract.md §1.3, Stage 24 commit 1c); the generator
# refuses a name that is both foreign and predefined.
foreign_macro_names = [
  "NDEBUG",
  "TARGET_CPU_ARM",
  "TARGET_CPU_ARM64",
  "TARGET_CPU_PPC",
  "TARGET_CPU_PPC64",
  "TARGET_CPU_X86",
  "TARGET_CPU_X86_64",
  "TARGET_OS_BRIDGE",
  "TARGET_RT_64_BIT",
  "TARGET_RT_BIG_ENDIAN",
  "TARGET_RT_LITTLE_ENDIAN",
  "TARGET_RT_MAC_CFM",
  "TARGET_RT_MAC_MACHO",
  "WINAPI_FAMILY",
  "bool",
]
