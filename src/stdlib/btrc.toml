	"kCTFontWeightTrait", "kCTFontTraitsAttribute", "kCTFontAttributeName", "CFRelease",
	"CFStringCreateWithBytes", "kCFStringEncodingUTF8", "CFAttributedStringCreate", "CTLineCreateWithAttributedString",
	"CTLineGetTypographicBounds", "CTLineGetBoundsWithOptions", "kCTLineBoundsUseGlyphPathBounds",
	"CGBitmapContextCreate", "kCGImageAlphaOnly", "CGContextSetShouldAntialias", "CGContextSetShouldSmoothFonts",
	"CGContextSetTextMatrix", "CGAffineTransformMake", "CGContextSetTextPosition", "CTLineDraw", "CGContextRelease"
