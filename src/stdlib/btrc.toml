	"-[NSEvent type]", "-[NSEvent keyCode]", "-[NSEvent modifierFlags]", "-[NSEvent isARepeat]", "-[NSEvent window]",
	"-[NSWindow isKeyWindow]", "-[NSWindow canBecomeKeyWindow]", "-[NSWindow windowNumber]",
	"-[NSWindow makeFirstResponder:]", "-[NSWindow resignKeyWindow]", "-[NSWindow makeKeyWindow]", "-[NSApplication postEvent:atStart:]",
	"+[NSEvent keyEventWithType:location:modifierFlags:timestamp:windowNumber:context:characters:charactersIgnoringModifiers:isARepeat:keyCode:]",
	"NSEventTypeKeyDown", "NSEventTypeKeyUp", "NSEventTypeFlagsChanged", "NSEventModifierFlagOption",
	"NSEventModifierFlagShift", "NSEventModifierFlagControl", "NSEventModifierFlagCommand", "kVK_Space", "kVK_Option", "kVK_RightOption",
	"MacOSLeftOptionFlag", "MacOSRightOptionFlag"
]
os = ["macos"]

