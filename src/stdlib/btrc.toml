manifest-version = 1

[package]
name = "btrc_stdlib_runtime"
exports = ["Array", "BitPattern", "Bytes", "CLI", "Callback", "Console", "DateTime", "IO", "Iterable", "JSON", "List", "Map", "Math", "OwnedBuffer", "Pattern", "Platform", "Process", "Random", "Regex", "Result", "SPSC", "Set", "Strings", "TOML", "Timer", "Vector"]

# Process's private host seam (docs/design/windows-os-services.md): the
# runtime's CreateProcessW seam on windows rows, and a selection-only shell
# around the POSIX bodies everywhere else.
[[package.providers]]
module = "Process"
implementation = "Unix.ProcessHostProvider"
os = ["android", "ios", "linux", "macos"]

[[package.providers]]
module = "Process"
implementation = "Windows.ProcessHostProvider"
os = ["windows"]

# IO's stream snapshots share Windows handle identity with FileSystem.
[[package.providers]]
module = "IO"
implementation = "Unix.IOHostProvider"
os = ["android", "ios", "linux", "macos"]

[[package.providers]]
module = "IO"
implementation = "Windows.IOHostProvider"
os = ["windows"]

# Every functional group is its own package; see README.md.
[dependencies]
App = { path = "App" }
Audio = { path = "Audio" }
BackgroundJobs = { path = "BackgroundJobs" }
COM = { path = "COM" }
Daemon = { path = "Daemon" }
Digest = { path = "Digest" }
FileSystem = { path = "FileSystem" }
GPU = { path = "GPU" }
GUI = { path = "GUI" }
Graph = { path = "Graph" }
HTTP = { path = "HTTP" }
Image = { path = "Image" }
Java = { path = "Java" }
LocalApplicationChannel = { path = "LocalApplicationChannel" }
Realtime = { path = "Realtime" }
Terminal = { path = "Terminal" }
Tray = { path = "Tray" }
UI = { path = "UI" }
