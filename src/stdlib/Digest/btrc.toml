manifest-version = 1

[package]
name = "btrc_stdlib_digest"
exports = ["CRC32", "Digest", "Fnv1a32", "NativeSHA256", "SHA256"]

# CommonCrypto is on every Apple system.
[[package.providers]]
module = "NativeSHA256"
implementation = "Apple.NativeSHA256Provider"
os = ["macos", "ios"]

[[package.providers]]
module = "NativeSHA256"
implementation = "NativeSHA256Provider"
os = ["linux", "windows"]

[[native.bindings]]
module = "Apple.NativeSHA256Provider"
header = "Apple/CommonDigest.h"
language = "c"
standard = "c11"
symbols = ["CC_SHA256", "CC_LONG"]
read-only-borrows = ["CC_SHA256.data"]
os = ["macos", "ios"]
