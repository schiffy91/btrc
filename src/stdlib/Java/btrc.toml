manifest-version = 1

[package]
name = "btrc_stdlib_java"
exports = ["JavaVirtualMachine"]

[[package.providers]]
module = "JavaVirtualMachine"
implementation = "Android.VirtualMachine"
os = ["android"]

[[native.sources]]
path = "JavaRuntime.c"
language = "c"
standard = "c11"
modules = ["JavaVirtualMachine"]
os = ["android"]

# btrcJavaAdopt is not selected: only C calls it, from the JNI_OnLoad of the
# library a running VM loaded, and BTRC sees the result through adopted().
[[native.bindings]]
module = "JavaVirtualMachine"
header = "JNI.h"
language = "c"
standard = "c11"
symbols = ["btrcJavaRunning", "btrcJavaAdopted", "btrcJavaLiveClaims", "btrcJavaLiveWeaks", "btrcJavaAttachedThreads", "btrcJavaLiveNatives", "btrcJavaDestroy"]
os = ["android"]
