manifest-version = 1

[package]
name = "btrc_stdlib_localapplicationchannel"
exports = ["LocalApplicationChannel", "LocalPeerCredentials"]

[[package.providers]]
module = "LocalPeerCredentials"
implementation = "MacOS.LocalPeerCredentialsProvider"
os = ["macos"]

[[package.providers]]
module = "LocalPeerCredentials"
implementation = "Linux.LocalPeerCredentialsProvider"
os = ["linux"]

[[native.bindings]]
module = "LocalApplicationChannel"
header = "Socket.h"
language = "c"
standard = "c11"
symbols = ["LocalSocketAddress", "socket", "connect", "bind", "listen", "accept", "getsockopt", "recv", "send", "shutdown", "close", "poll", "pollfd", "AF_UNIX", "SOCK_STREAM", "SOL_SOCKET", "SO_ERROR", "MSG_NOSIGNAL", "SHUT_RDWR", "POLLIN", "POLLOUT"]
os = ["linux", "macos"]

[[native.defines]]
name = "_GNU_SOURCE"
value = "1"
modules = ["LocalApplicationChannel", "Linux.LocalPeerCredentialsProvider"]
os = ["linux"]
