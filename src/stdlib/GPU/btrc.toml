manifest-version = 1

[package]
name = "btrc_stdlib_gpu"
exports = ["Device", "ImageTexture", "Program", "Readback", "SurfaceRenderer", "UniformBuffer", "WebGPU"]

[[native.pkg-config]]
name = "wgpu-native"
modules = ["WebGPU"]
os = ["macos"]

[[native.bindings]]
module = "WebGPU"
header = "WebGPUImports.h"
language = "c"
standard = "c11"
symbols = [
	"wgpuInstanceRequestAdapter", "WGPURequestAdapterOptions", "WGPUCallbackMode_AllowProcessEvents",
	"WGPUInstance", "WGPUSurface", "WGPUAdapter", "WGPUDevice", "WGPUQueue",
	"wgpuInstanceProcessEvents", "wgpuInstanceAddRef", "wgpuInstanceRelease", "wgpuSurfaceAddRef", "wgpuSurfaceRelease", "wgpuAdapterAddRef", "wgpuDeviceAddRef", "wgpuQueueAddRef",
	"WGPURequestAdapterCallbackInfo", "WGPURequestDeviceCallbackInfo", "WGPUStringView",
	"wgpuAdapterRequestDevice", "wgpuAdapterRelease", "wgpuDeviceRelease", "wgpuDeviceGetQueue", "wgpuQueueRelease",
	"WGPURequestAdapterStatus_Success", "WGPURequestDeviceStatus_Success",
	"WGPUPopErrorScopeCallbackInfo", "WGPUBufferMapCallbackInfo",
	"wgpuDeviceGetLimits", "WGPULimits", "wgpuSurfaceGetCapabilities", "wgpuSurfaceCapabilitiesFreeMembers", "WGPUStatus_Success",
	"WGPUTextureFormat_BGRA8Unorm", "WGPUTextureFormat_RGBA8Unorm", "WGPUTextureUsage_RenderAttachment", "WGPUTextureUsage_CopySrc",
	"wgpuSurfaceConfigure", "wgpuSurfaceUnconfigure", "WGPUSurfaceConfiguration", "WGPUPresentMode_Fifo", "WGPUPresentMode_Immediate",
	"wgpuSurfaceGetCurrentTexture", "WGPUSurfaceTexture", "WGPUSurfaceGetCurrentTextureStatus_SuccessOptimal", "WGPUSurfaceGetCurrentTextureStatus_SuccessSuboptimal",
	"WGPUSurfaceGetCurrentTextureStatus_Timeout", "WGPUSurfaceGetCurrentTextureStatus_Outdated",
	"wgpuTextureCreateView", "wgpuDeviceCreateCommandEncoder", "wgpuCommandEncoderBeginRenderPass", "WGPURenderPassColorAttachment", "WGPURenderPassDescriptor",
