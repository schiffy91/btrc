manifest-version = 1

[package]
name = "btrc_stdlib_gpu"
exports = ["GPUCommandBatch", "GPUCompletionPump", "GPUComputeProgram", "GPUDevice", "GPUImageTexture", "GPUOffscreenTarget", "GPUProgram", "GPUReadback", "GPUStorageBuffer", "GPUSurfaceRenderer", "GPUTexture", "GPUUniformBuffer", "WebGPU"]

[[native.pkg-config]]
name = "wgpu-native"
modules = ["WebGPU"]
os = ["macos", "linux"]

# Windows links wgpu-native v27.0.4.0's pinned prebuilt release DLL
# (nix/wgpu-native-prebuilt.nix) through a per-slice pkg-config record, so
# a Windows row never resolves the host's wgpu-native: the x64 slice is the
# MinGW archive's import library, the ARM64 slice the only ARM64 asset, the
# MSVC build, whose DLL a MinGW program reaches through its import library.
[[native.pkg-config]]
name = "wgpu-native-windows-x86_64"
modules = ["WebGPU"]
os = ["windows"]
arch = ["x86_64"]

[[native.pkg-config]]
name = "wgpu-native-windows-aarch64"
modules = ["WebGPU"]
os = ["windows"]
arch = ["aarch64"]

# An Android app has no pkg-config search path: its build gives the compiler
# and the linker the directories of wgpu-native's pinned prebuilt archive
# (nix/wgpu-native-prebuilt.nix), and packs libwgpu_native.so into the app.
[[native.libraries]]
name = "wgpu_native"
modules = ["WebGPU"]
os = ["android"]

# An iOS app is in the same position, and wgpu-native's pinned archive there
# is a static library: the app links it and the frameworks it draws through.
[[native.libraries]]
name = "wgpu_native"
modules = ["WebGPU"]
os = ["ios"]

[[native.frameworks]]
name = "Metal"
modules = ["WebGPU"]
os = ["ios"]

[[native.frameworks]]
name = "QuartzCore"
modules = ["WebGPU"]
os = ["ios"]

[[native.frameworks]]
name = "CoreGraphics"
modules = ["WebGPU"]
os = ["ios"]

[[native.frameworks]]
name = "Foundation"
modules = ["WebGPU"]
os = ["ios"]

[[native.sources]]
path = "WebGPUCompat.c"
language = "c"
standard = "c11"
modules = ["WebGPU"]
os = ["macos", "linux", "windows", "android", "ios"]

