	"WGPUBindGroupEntry", "WGPUBindGroupDescriptor", "wgpuDeviceCreateBindGroup", "wgpuBindGroupRelease", "wgpuRenderPassEncoderSetPipeline", "wgpuRenderPassEncoderSetBindGroup", "wgpuRenderPassEncoderDraw",
