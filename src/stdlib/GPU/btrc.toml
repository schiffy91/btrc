borrowed-parameters = [
	"wgpuInstanceRequestAdapter.instance", "wgpuInstanceProcessEvents.instance", "wgpuAdapterRequestDevice.adapter", "wgpuDeviceGetQueue.device",
	"wgpuDeviceGetLimits.device", "wgpuSurfaceGetCapabilities.surface", "wgpuSurfaceGetCapabilities.adapter", "wgpuSurfaceConfigure.surface", "wgpuSurfaceUnconfigure.surface",
	"wgpuSurfaceGetCurrentTexture.surface", "wgpuSurfacePresent.surface", "wgpuDeviceCreateCommandEncoder.device", "wgpuQueueSubmit.queue",
	"wgpuDeviceCreateBuffer.device", "wgpuQueueWriteBuffer.queue", "wgpuDeviceCreateTexture.device", "wgpuDeviceCreateSampler.device", "wgpuQueueWriteTexture.queue",
	"wgpuDevicePushErrorScope.device", "wgpuDevicePopErrorScope.device", "wgpuDeviceCreateShaderModule.device", "wgpuDeviceCreateBindGroupLayout.device",
	"wgpuDeviceCreatePipelineLayout.device", "wgpuDeviceCreateRenderPipeline.device", "wgpuDeviceCreateBindGroup.device"
]
