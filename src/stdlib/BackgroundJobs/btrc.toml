manifest-version = 1

[package]
name = "btrc_stdlib_backgroundjobs"
exports = ["BackgroundJobExecutor", "BackgroundJobs", "HostWorkerPools", "NativeWorker", "ProcessThreads", "WorkerPools"]

[[package.providers]]
module = "HostWorkerPools"
implementation = "Unix.WorkerPoolProvider"
os = ["linux", "macos"]

# A system without fork has the inline pool: Windows, and iOS and iPadOS,
# where an app may not start another process.
[[package.providers]]
module = "HostWorkerPools"
implementation = "WorkerPoolProvider"
os = ["windows", "ios"]

[[package.providers]]
module = "ProcessThreads"
implementation = "Linux.ProcessThreadsProvider"
os = ["linux"]

[[package.providers]]
module = "ProcessThreads"
implementation = "Apple.ProcessThreadsProvider"
os = ["macos", "ios"]

[[native.bindings]]
module = "Apple.ProcessThreadsProvider"
header = "Apple/ProcessThreads.h"
language = "c"
standard = "c11"
symbols = ["btrcProcessThreadCount"]
os = ["macos", "ios"]

[[native.bindings]]
module = "BackgroundJobExecutor"
header = "NativeThreads.h"
language = "c"
standard = "c11"
symbols = ["pthread_self", "pthread_equal", "pthread_mutex_init", "pthread_mutex_destroy", "pthread_mutex_lock", "pthread_mutex_trylock", "pthread_mutex_unlock", "pthread_cond_init", "pthread_cond_destroy", "pthread_cond_wait", "pthread_cond_signal", "pthread_cond_broadcast"]
os = ["linux", "macos", "ios"]

[[native.bindings]]
module = "NativeWorker"
header = "NativeThreads.h"
language = "c"
standard = "c11"
symbols = ["pthread_create", "pthread_join"]
os = ["linux", "macos", "ios"]

[[package.providers]]
module = "ProcessThreads"
implementation = "Windows.ProcessThreadsProvider"
os = ["windows"]

[[native.bindings]]
module = "Windows.ProcessThreadsProvider"
header = "Windows/ProcessThreads.h"
language = "c"
standard = "c11"
symbols = ["THREADENTRY32", "CreateToolhelp32Snapshot", "Thread32First", "Thread32Next", "GetCurrentProcessId", "GetLastError", "CloseHandle", "TH32CS_SNAPTHREAD", "INVALID_HANDLE_VALUE", "ERROR_NO_MORE_FILES", "INT_MAX", "BTRC_THREAD_OWNER_END"]
os = ["windows"]
