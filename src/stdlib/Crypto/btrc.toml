manifest-version = 1

[package]
name = "btrc_stdlib_crypto"
exports = [
	"Base64", "Crypto", "SecureChannel", "SigningKey", "Sodium", "TrustedKeys",
	"Primitives.BLAKE2b", "Primitives.ChaCha20", "Primitives.Ed25519", "Primitives.Poly1305",
	"Primitives.SHA512", "Primitives.SecretStream", "Primitives.X25519"
]

[[package.providers]]
module = "Sodium"
implementation = "Unix.SodiumProvider"
os = ["linux", "macos", "ios"]

[[package.providers]]
module = "SigningKey"
implementation = "Unix.CryptoProvider"
os = ["linux", "macos", "ios"]

[[package.providers]]
module = "SecureChannel"
implementation = "Unix.CryptoProvider"
os = ["linux", "macos", "ios"]

[[package.providers]]
module = "TrustedKeys"
implementation = "Unix.CryptoProvider"
os = ["linux", "macos", "ios"]

[[package.providers]]
module = "Crypto"
implementation = "Unix.CryptoProvider"
os = ["linux", "macos", "ios"]

[[native.pkg-config]]
name = "libsodium"
modules = ["Unix.SodiumProvider"]
os = ["linux", "macos"]

# An iOS program has no pkg-config search path: it links the static library
# tools/target_hosts/libsodium.py builds for its target, which its build names
# the directory of.
[[native.libraries]]
name = "sodium"
modules = ["Unix.SodiumProvider"]
os = ["ios"]

[[native.bindings]]
module = "Unix.SodiumProvider"
header = "Unix/Sodium.h"
language = "c"
standard = "c11"
symbols = [
	"btrcSodiumStart", "btrcSodiumRandom", "btrcSodiumWipe",
	"btrcSodiumSigningKeys", "btrcSodiumSign", "btrcSodiumVerify",
	"btrcSodiumExchangeKeys", "btrcSodiumSessionKeys", "btrcSodiumHash", "btrcSodiumSHA256",
	"btrcSodiumBeginSending", "btrcSodiumBeginReceiving", "btrcSodiumSeal", "btrcSodiumOpen"
]
os = ["linux", "macos", "ios"]
