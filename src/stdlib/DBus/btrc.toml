manifest-version = 1

[package]
name = "btrc_stdlib_dbus"
exports = ["DBus", "DBusAddress", "DBusConnection", "DBusMessage"]

# The transport is the one part that touches the system: a Unix-domain socket.
[[package.providers]]
module = "DBusConnection"
implementation = "Linux.DBusTransportProvider"
os = ["linux"]

[[native.bindings]]
module = "Linux.DBusTransportProvider"
header = "Linux/Socket.h"
language = "c"
standard = "c11"
symbols = ["DBusSocketAddress", "btrcDBusReceive", "btrcDBusLaunchSession", "addrinfo", "getaddrinfo", "freeaddrinfo", "passwd", "getpwuid_r"]
read-only-borrows = ["btrcDBusLaunchSession.machineId"]
os = ["linux"]

[[native.include-directories]]
path = "X11Autolaunch"
modules = ["Linux.DBusTransportProvider"]
os = ["linux"]

[[native.defines]]
name = "_GNU_SOURCE"
value = "1"
modules = ["Linux.DBusTransportProvider"]
os = ["linux"]
