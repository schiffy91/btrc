manifest-version = 1

[package]
name = "btrc_stdlib_tray"
exports = ["ITray", "Tray", "TrayModel"]

[[package.providers]]
module = "Tray"
implementation = "MacOS.TrayProvider"
os = ["macos"]

[[package.providers]]
module = "Tray"
implementation = "Linux.TrayProvider"
os = ["linux"]

[[native.bindings]]
module = "MacOS.MacOSTray"
header = "MacOS/AppKit.h"
language = "objective-c"
standard = "c11"
symbols = [
	"+[NSThread isMainThread]",
	"+[NSApplication sharedApplication]",
	"-[NSApplication setActivationPolicy:]",
	"-[NSApplication activationPolicy]",
	"NSApplicationActivationPolicyAccessory",
	"NSApplicationActivationPolicyProhibited",
	"+[NSStatusBar systemStatusBar]",
	"-[NSStatusBar statusItemWithLength:]",
	"-[NSStatusBar removeStatusItem:]",
	"NSVariableStatusItemLength",
	"-[NSStatusItem button]",
	"-[NSStatusItem setMenu:]",
	"-[NSStatusItem setVisible:]",
	"-[NSStatusBarButton setTitle:]",
	"-[NSStatusBarButton setImage:]",
	"-[NSStatusBarButton setToolTip:]",
	"+[NSMenu new]",
	"-[NSMenu setAutoenablesItems:]",
	"-[NSMenu addItem:]",
	"+[NSMenuItem new]",
	"-[NSMenuItem setTitle:]",
	"-[NSMenuItem setEnabled:]",
	"-[NSMenuItem setState:]",
	"-[NSMenuItem setTarget:]",
	"-[NSMenuItem target]",
	"-[NSMenuItem setAction:]",
	"-[NSMenuItem action]",
	"NSControlStateValueOn",
	"NSControlStateValueOff",
	"+[NSImage new]",
	"+[NSImageRep imageRepWithContentsOfFile:]",
	"-[NSImage addRepresentation:]",
	"-[NSImage setTemplate:]",
	"-[NSImage setSize:]",
	"+[NSDate distantFuture]",
	"+[NSDate dateWithTimeIntervalSinceNow:]",
	"-[NSApplication nextEventMatchingMask:untilDate:inMode:dequeue:]",
	"-[NSApplication sendEvent:]",
	"NSEventMaskAny",
	"NSDefaultRunLoopMode",
	"-[NSApplication run]",
	"-[NSApplication isRunning]",
	"-[NSApplication finishLaunching]"
]
os = ["macos"]

[native.bindings.callbacks."-[NSMenuItem setTarget:].target"]
interface = "IAppKitTrayAction"
lifetime = "stored"
failure = "abort"
executor = "caller"
unregister = "-[NSMenuItem setTarget:]"
slot-getter = "-[NSMenuItem target]"
action-setter = "-[NSMenuItem setAction:]"
action-getter = "-[NSMenuItem action]"
activation-failure = "abort"
cancellation = "entry-barrier"

[[native.frameworks]]
name = "AppKit"
modules = ["MacOS.MacOSTray"]
os = ["macos"]

[[native.pkg-config]]
name = "dbus-1"
modules = ["Linux.LinuxTray"]
os = ["linux"]

[[native.bindings]]
module = "Linux.LinuxTray"
header = "Linux/DBus.h"
language = "c"
standard = "c11"
symbols = [
	"DBusConnection", "DBusMessage", "DBusMessageIter",
	"btrcDBusOpenSessionBus", "btrcDBusOwnName", "btrcDBusCallSucceeds", "btrcDBusAddMatch",
	"dbus_bus_get_unique_name", "dbus_message_get_path", "dbus_message_get_interface", "dbus_message_get_member",
	"btrcDBusAppendString", "btrcDBusAppendInt32", "btrcDBusAppendUInt32", "btrcDBusAppendBool",
	"btrcDBusReadString", "btrcDBusReadInt32",
	"dbus_connection_set_exit_on_disconnect", "dbus_connection_close", "dbus_connection_unref",
	"dbus_connection_read_write", "dbus_connection_pop_message", "dbus_connection_send", "dbus_connection_flush",
	"dbus_message_new_method_call", "dbus_message_new_method_return", "dbus_message_new_error", "dbus_message_new_signal",
	"dbus_message_unref", "dbus_message_get_type", "dbus_message_get_no_reply", "dbus_message_is_signal",
	"dbus_message_iter_init_append", "dbus_message_iter_init", "dbus_message_iter_next", "dbus_message_iter_get_arg_type", "dbus_message_iter_recurse",
	"dbus_message_iter_open_container", "dbus_message_iter_close_container",
	"DBUS_MESSAGE_TYPE_METHOD_CALL", "DBUS_TYPE_ARRAY", "DBUS_TYPE_DICT_ENTRY", "DBUS_TYPE_OBJECT_PATH", "DBUS_TYPE_STRING",
	"DBUS_TYPE_STRUCT", "DBUS_TYPE_VARIANT"
]
read-only-borrows = [
	"dbus_message_new_method_call.bus_name", "dbus_message_new_method_call.path", "dbus_message_new_method_call.iface", "dbus_message_new_method_call.method",
	"dbus_message_new_signal.path", "dbus_message_new_signal.iface", "dbus_message_new_signal.name",
	"dbus_message_new_error.error_name", "dbus_message_new_error.error_message",
	"dbus_message_iter_open_container.contained_signature",
	"dbus_message_is_signal.iface", "dbus_message_is_signal.signal_name",
	"btrcDBusOwnName.name", "btrcDBusAppendString.value", "btrcDBusAddMatch.rule"
]
os = ["linux"]
