manifest-version = 1

[package]
name = "btrc_stdlib_usb"
exports = ["USB", "USBDescriptors", "USBGadget", "USBHID", "USBHost", "USBIP", "USBVirtualDevice"]

[[package.providers]]
module = "USBIP"
implementation = "Unix.USBIPProvider"
os = ["linux", "macos"]

[[package.providers]]
module = "USB"
implementation = "Unix.USBIPProvider"
os = ["linux", "macos"]

[[package.providers]]
module = "USBHost"
implementation = "Linux.USBHostProvider"
os = ["linux"]

[[package.providers]]
module = "USBHost"
implementation = "MacOS.USBHostProvider"
os = ["macos"]

[[package.providers]]
module = "USBGadget"
implementation = "Linux.USBGadgetProvider"
os = ["linux"]

[[package.providers]]
module = "USBGadget"
implementation = "MacOS.USBGadgetProvider"
os = ["macos"]

[[native.bindings]]
module = "Linux.USBGadgetProvider"
header = "Linux/FunctionFS.h"
language = "c"
standard = "c11"
symbols = [
	"BtrcFunctionFSTransfer", "btrcFunctionFSTransferNew", "btrcFunctionFSTransferFree", "btrcFunctionFSTransferData",
	"btrcFunctionFSMount", "btrcFunctionFSUnmount", "btrcFunctionFSQueue", "btrcFunctionFSQueueClose",
	"btrcFunctionFSNotifier", "btrcFunctionFSQuiet", "btrcFunctionFSSubmit", "btrcFunctionFSReap", "O_CLOEXEC"
]
read-only-borrows = ["btrcFunctionFSMount.name", "btrcFunctionFSMount.directory", "btrcFunctionFSUnmount.directory"]
os = ["linux"]

[[native.bindings]]
module = "Linux.USBHostProvider"
header = "Linux/USBFS.h"
language = "c"
standard = "c11"
symbols = ["btrcUSBFSClaim", "btrcUSBFSUnclaim", "btrcUSBFSRebind", "btrcUSBFSControl", "btrcUSBFSTransfer", "O_CLOEXEC"]
os = ["linux"]

# glibc declares O_CLOEXEC only under a POSIX feature macro.
[[native.defines]]
name = "_GNU_SOURCE"
value = "1"
modules = ["Linux.USBHostProvider", "Linux.USBGadgetProvider"]
os = ["linux"]
