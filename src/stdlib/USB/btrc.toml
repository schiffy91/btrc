manifest-version = 1

[package]
name = "btrc_stdlib_usb"
exports = ["USB", "USBDescriptors", "USBHost", "USBIP", "USBVirtualDevice"]

[[package.providers]]
module = "USBIP"
implementation = "Unix.USBIPProvider"
os = ["linux", "macos"]

[[package.providers]]
module = "USB"
implementation = "Unix.USBIPProvider"
os = ["linux", "macos"]

[[package.providers]]
module = "USBHost"
implementation = "Linux.USBHostProvider"
os = ["linux"]

[[package.providers]]
module = "USBHost"
implementation = "MacOS.USBHostProvider"
os = ["macos"]

[[native.bindings]]
module = "Linux.USBHostProvider"
header = "Linux/USBFS.h"
language = "c"
standard = "c11"
symbols = ["btrcUSBFSClaim", "btrcUSBFSUnclaim", "btrcUSBFSDriver", "btrcUSBFSControl", "btrcUSBFSTransfer", "O_CLOEXEC"]
os = ["linux"]

# glibc declares O_CLOEXEC only under a POSIX feature macro.
[[native.defines]]
name = "_GNU_SOURCE"
value = "1"
modules = ["Linux.USBHostProvider"]
os = ["linux"]
