manifest-version = 1

[package]
name = "btrc_stdlib_http"
exports = ["HTTP", "HTTPClient", "HTTPExchange", "HTTPFraming", "HTTPRequest", "HTTPResponse", "HTTPResponseHeaders", "HTTPServer", "HTTPSocket", "HTTPStatus", "HTTPUrl"]

[[package.providers]]
module = "HTTPSocket"
implementation = "Unix.HTTPSocketProvider"
os = ["android", "ios", "linux", "macos"]

[[package.providers]]
module = "HTTPSocket"
implementation = "Windows.HTTPSocketProvider"
os = ["windows"]

[[package.providers]]
module = "HTTPClient"
implementation = "Unix.HTTPTransportProvider"
os = ["android", "ios", "linux", "macos"]

[[package.providers]]
module = "HTTPClient"
implementation = "Windows.HTTPTransportProvider"
os = ["windows"]

# The client's resolver and socket calls on the BSD-socket systems.
[[native.bindings]]
module = "Unix.HTTPPlainTransport"
header = "Unix/ClientSockets.h"
language = "c"
standard = "c11"
symbols = ["addrinfo", "btrcHttpResolve", "freeaddrinfo"]
os = ["android", "ios", "linux", "macos"]

[[native.sources]]
path = "Unix/ClientResolver.c"
language = "c"
standard = "c11"
modules = ["Unix.HTTPPlainTransport"]
os = ["android", "ios", "linux", "macos"]

[[native.sources]]
path = "Unix/ProxyBypass.c"
language = "c"
standard = "c11"
modules = ["Unix.HTTPProxy"]
os = ["android", "linux", "macos"]

# glibc declares the resolver only under a POSIX feature macro.
[[native.defines]]
name = "_GNU_SOURCE"
value = "1"
modules = ["Unix.HTTPPlainTransport"]
os = ["linux"]

[[native.sources]]
path = "Windows/Win32Sockets.c"
language = "c"
standard = "c11"
modules = ["HTTPSocket"]
os = ["windows"]

[[native.include-directories]]
path = "Windows"
modules = ["HTTPSocket", "Windows.HTTPTransportProvider"]
os = ["windows"]

[[native.libraries]]
name = "ws2_32"
modules = ["HTTPSocket"]
os = ["windows"]

# The client's transport: WinHTTP, part of Windows.
[[native.sources]]
path = "Windows/WinHttpTransport.c"
language = "c"
standard = "c11"
modules = ["Windows.HTTPTransportProvider"]
os = ["windows"]

[[native.libraries]]
name = "winhttp"
modules = ["Windows.HTTPTransportProvider"]
os = ["windows"]
