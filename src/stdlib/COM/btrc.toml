manifest-version = 1

[package]
name = "btrc_stdlib_com"
exports = ["COMApartment"]

# The apartment, its claim and sink counts and the UTF-16 text of copied
# outputs. On Windows CoInitializeEx and CoUninitialize come from ole32;
# elsewhere the program supplies them, as the proxy COM fixtures do.
[[native.sources]]
path = "COMRuntime.c"
language = "c"
standard = "c11"
modules = ["COMApartment"]

# Generated COM adapters call btrcCOMRequireApartment, btrcCOMClaim,
# btrcCOMUnclaim, the sink counts and the text functions by name; selecting
# them keeps COM.h in every unit that does.
[[native.bindings]]
module = "COMApartment"
header = "COM.h"
language = "c"
standard = "c11"
symbols = ["btrcCOMInitialize", "btrcCOMInitialized", "btrcCOMLiveClaims", "btrcCOMLiveSinks", "btrcCOMUninitialize", "btrcCOMRequireApartment", "btrcCOMClaim", "btrcCOMUnclaim", "btrcCOMSinkOpened", "btrcCOMSinkClosed", "btrcCOMTextUnits", "btrcCOMTextLength", "btrcCOMEncodeText"]

# Windows links the apartment (ole32: CoInitializeEx, CoTaskMemFree), the
# SDK's IID objects (uuid) and BSTRs (oleaut32: SysFreeString).
[[native.libraries]]
name = "ole32"
os = ["windows"]
modules = ["COMApartment"]

[[native.libraries]]
name = "uuid"
os = ["windows"]
modules = ["COMApartment"]

[[native.libraries]]
name = "oleaut32"
os = ["windows"]
modules = ["COMApartment"]
