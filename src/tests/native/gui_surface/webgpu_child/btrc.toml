manifest-version = 1
[package]
name = "nativeGpuChild"

[[native.bindings]]
module = "Main"
header = "CaptureProbe.h"
language = "objective-c"
standard = "c11"
symbols = ["+[CaptureProbe childCount:]"]
os = ["macos"]

[[native.sources]]
path = "CaptureProbe.m"
modules = ["Main"]
language = "objective-c"
standard = "c11"
os = ["macos"]

[[native.bindings]]
module = "CompletionProbe"
header = "CompletionProbe.h"
language = "c"
standard = "c11"
symbols = ["probeDelayCompletions", "probeDeliverCompletion", "probePendingCompletions", "probeAdapterClaims", "probeDeviceClaims", "probeBufferClaims"]

[[native.sources]]
path = "CompletionProbe.c"
modules = ["CompletionProbe"]
language = "c"
standard = "c11"

[[native.pkg-config]]
name = "wgpu-native"
modules = ["CompletionProbe"]
