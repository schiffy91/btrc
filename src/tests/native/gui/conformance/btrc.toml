manifest-version = 1

[package]
name = "guiConformance"
exports = ["Main"]

[dependencies]
embedded = { path = "../../../../../packages/embedded-web" }

# The font cases need FreeType, which not every platform's SDK has.
[[package.providers]]
module = "Main"
implementation = "Fonts.FreeTypeCases"
os = ["linux", "macos"]

[[package.providers]]
module = "Main"
implementation = "Fonts.NoCases"
os = ["windows", "android", "ios"]

# The modal cases need a probe that can answer a modal from beside the program.
[[package.providers]]
module = "Modal"
implementation = "Modals.ShimCases"
os = ["linux", "windows", "android", "macos", "ios"]

[[native.bindings]]
module = "Modals.ShimCases"
header = "probes/shim/ModalProbe.h"
language = "c"
standard = "c11"
symbols = ["modalProbeAnswer", "modalProbeDone", "modalProbeHasFolderChooser"]
os = ["linux", "windows", "android", "macos", "ios"]

[[native.sources]]
path = "probes/shim/ModalProbe.c"
language = "c"
standard = "c11"
modules = ["Modals.ShimCases"]
os = ["linux", "windows", "android", "ios"]

[[native.bindings]]
module = "Probe"
header = "probes/ConformanceProbe.h"
language = "c"
standard = "c11"
symbols = [
  "conformanceProbeMove",
  "conformanceProbePress",
  "conformanceProbeRelease",
  "conformanceProbeWheel",
  "conformanceProbeKey",
  "conformanceProbeText",
  "conformanceProbeClose",
  "conformanceProbeService",
  "conformanceProbeWindowSizing",
]
read-only-borrows = [
  "conformanceProbeMove.title",
  "conformanceProbePress.title",
  "conformanceProbeRelease.title",
  "conformanceProbeWheel.title",
  "conformanceProbeKey.title",
  "conformanceProbeText.title",
  "conformanceProbeText.text",
  "conformanceProbeClose.title",
]

[[native.sources]]
path = "probes/shim/ConformanceProbe.c"
language = "c"
standard = "c11"
modules = ["Probe"]
os = ["linux", "windows", "android"]

[[native.sources]]
path = "probes/shim/ShimProbe.c"
language = "c"
standard = "c11"
modules = ["Probe"]
os = ["linux", "windows", "android"]

[[native.sources]]
path = "probes/linux/X11Input.c"
language = "c"
standard = "c11"
modules = ["Probe"]
os = ["linux"]

[[native.sources]]
path = "probes/linux/WaylandInput.c"
language = "c"
standard = "c11"
modules = ["Probe"]
os = ["linux"]

[[native.sources]]
path = "probes/linux/wayland/wlr-virtual-pointer-unstable-v1-protocol.c"
language = "c"
standard = "c11"
modules = ["Probe"]
os = ["linux"]

[[native.sources]]
path = "probes/linux/wayland/virtual-keyboard-unstable-v1-protocol.c"
language = "c"
standard = "c11"
modules = ["Probe"]
os = ["linux"]

[[native.sources]]
path = "probes/linux/wayland/wlr-foreign-toplevel-management-unstable-v1-protocol.c"
language = "c"
standard = "c11"
modules = ["Probe"]
os = ["linux"]

[[native.pkg-config]]
name = "x11"
modules = ["Probe"]
os = ["linux"]

[[native.pkg-config]]
name = "xtst"
modules = ["Probe"]
os = ["linux"]

[[native.pkg-config]]
name = "wayland-client"
modules = ["Probe"]
os = ["linux"]

[[native.sources]]
path = "probes/windows/Win32Input.c"
language = "c"
standard = "c11"
modules = ["Probe"]
os = ["windows"]

[[native.libraries]]
name = "user32"
modules = ["Probe"]
os = ["windows"]

[[native.sources]]
path = "probes/macos/AppKitProbe.m"
language = "objective-c"
standard = "c11"
modules = ["Probe"]
os = ["macos"]

[[native.frameworks]]
name = "AppKit"
modules = ["Probe", "Modals.ShimCases"]
os = ["macos"]

[[native.sources]]
path = "probes/macos/AppKitModalProbe.m"
language = "objective-c"
standard = "c11"
modules = ["Modals.ShimCases"]
os = ["macos"]

[[native.sources]]
path = "probes/android/AndroidInput.c"
language = "c"
standard = "c11"
modules = ["Probe"]
os = ["android"]

[[native.sources]]
path = "probes/ios/SimulatorProbe.c"
language = "c"
standard = "c11"
modules = ["Probe"]
os = ["ios"]
