manifest-version = 1

[package]
name = "guiConformance"
exports = ["Main"]

[[native.bindings]]
module = "Probe"
header = "probes/ConformanceProbe.h"
language = "c"
standard = "c11"
symbols = [
  "conformanceProbeMove",
  "conformanceProbePress",
  "conformanceProbeRelease",
  "conformanceProbeWheel",
  "conformanceProbeKey",
  "conformanceProbeText",
  "conformanceProbeClose",
  "conformanceProbeService",
]
read-only-borrows = [
  "conformanceProbeMove.title",
  "conformanceProbePress.title",
  "conformanceProbeRelease.title",
  "conformanceProbeWheel.title",
  "conformanceProbeKey.title",
  "conformanceProbeText.title",
  "conformanceProbeText.text",
  "conformanceProbeClose.title",
]

[[native.sources]]
path = "probes/linux/LinuxProbe.c"
language = "c"
standard = "c11"
modules = ["Probe"]
os = ["linux"]

[[native.sources]]
path = "probes/linux/GtkProbe.c"
language = "c"
standard = "c11"
modules = ["Probe"]
os = ["linux"]

[[native.sources]]
path = "probes/linux/X11Input.c"
language = "c"
standard = "c11"
modules = ["Probe"]
os = ["linux"]

[[native.sources]]
path = "probes/linux/WaylandInput.c"
language = "c"
standard = "c11"
modules = ["Probe"]
os = ["linux"]

[[native.sources]]
path = "probes/linux/wayland/wlr-virtual-pointer-unstable-v1-protocol.c"
language = "c"
standard = "c11"
modules = ["Probe"]
os = ["linux"]

[[native.sources]]
path = "probes/linux/wayland/virtual-keyboard-unstable-v1-protocol.c"
language = "c"
standard = "c11"
modules = ["Probe"]
os = ["linux"]

[[native.sources]]
path = "probes/linux/wayland/wlr-foreign-toplevel-management-unstable-v1-protocol.c"
language = "c"
standard = "c11"
modules = ["Probe"]
os = ["linux"]

[[native.pkg-config]]
name = "x11"
modules = ["Probe"]
os = ["linux"]

[[native.pkg-config]]
name = "xtst"
modules = ["Probe"]
os = ["linux"]

[[native.pkg-config]]
name = "wayland-client"
modules = ["Probe"]
os = ["linux"]
