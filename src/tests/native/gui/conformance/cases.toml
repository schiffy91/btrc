# The suite's cases, in the order the program runs them, and the catalog
# operations each one exercises (docs/design/native-ui-catalog/operations).
# The driver runs one process per case and holds this list to the program's
# own `--list`, and the operations to the catalog.

[[case]]
name = "button.state"
operations = [
  "IButton.title", "IButton.setTitle", "IButton.isEnabled", "IButton.setEnabled",
  "IButton.isSelected", "IButton.setSelected", "IButton.toolTip", "IButton.setToolTip",
  "GUI.createButton", "IApplication.createButton"
]

[[case]]
name = "button.click"
operations = [
  "IButton.onAction", "IButtonAction.invoke"
]

