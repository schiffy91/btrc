accepted_sha256 = "af97ee150484ac723d77904ecc0bfb105ee09f778eeb2a592bca455852ecba09"
reason = "The application-directory platform helper is now the general __btrc_target_platform, which Platform.isWindows also reads; it is renamed in place with an override macro to match, so only its name and text change. Merged with root-b's removal of nine unused helpers ahead of it (2026-10-01 wave-1 integration): btrc_order 213->204 and python_order 228->219; text unchanged. Stage 4 D051 (PLAN.md D14): the unused __btrc_join helper leaves strings.c and the manifest (Strings.join delegates to Vector.join), and the later helpers' catalog orders close up contiguously; generated C is unchanged because no lowering ever selected it. Stage 4 C-output parity (PLAN.md D14): __btrc_gpu_index_check joins the btrc catalog at its Python position, so btrcc's @gpu CPU fallback calls the pre-authored bounds check instead of lowering its own __btrc_gpu_checked_index; every later btrc order moves up by one. Helper sources are unchanged. Stage 25 CL-P1-16 (PLAN.md D14): __btrc_target_platform reports iOS (4) for Apple targets built for an iOS environment (__ENVIRONMENT_IPHONE_OS_VERSION_MIN_REQUIRED__) and Android (5) for __ANDROID__, ahead of the macOS (1) and Linux (2) branches those targets also satisfy; Platform.isIOS/isAndroid/isApple/isMobile read it, and the Unix worker pool treats iOS as Apple. Only this helper's text changes; macOS, Linux and Windows codes are unchanged."
regressions = ["src/tests/btrc/test_target_probes.py", "src/tests/python/test_application_directories_contract.py", "src/tests/python/test_runtime_helper_registry.py"]

