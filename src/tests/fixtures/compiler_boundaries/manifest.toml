reason = "Stage 4 D060 (PLAN.md D14): the runtime drops its legacy aliases. The seven never-emitted __btrc_math_* helpers and the __btrc_str_track forwarder and no-op __btrc_str_flush leave core.c, strings.c and the manifest, every adoption is spelled __btrc_string_adopt, and the remaining helpers' catalog orders close up contiguously. Generated C loses only the forwarder definition; behavior is unchanged. ApplicationDirectories resolves macOS, Linux, and future Windows policy through a compiler-owned runtime platform discriminator. The application-directory platform helper is now the general __btrc_target_platform, which Platform.isWindows also reads; it is renamed in place with an override macro to match, so only its name and text change. Merged with root-b's removal of the unused __btrc_math_* helpers and __btrc_str_track/__btrc_str_flush (2026-10-01 wave-1 integration): the accepted text is exactly the union of both lanes' accepted core.c deltas. The new __btrc_target_architecture helper joins core.c after __btrc_target_platform: the C compiler's target architecture (1 = x86_64, 2 = aarch64, 0 = other, with an override macro), which btrcc reads to infer its host package target as the reference compiler does. Stage 25 CL-P1-16 (PLAN.md D14): __btrc_target_platform reports iOS (4) for Apple targets built for an iOS environment (__ENVIRONMENT_IPHONE_OS_VERSION_MIN_REQUIRED__) and Android (5) for __ANDROID__, ahead of the macOS (1) and Linux (2) branches those targets also satisfy; Platform.isIOS/isAndroid/isApple/isMobile read it, and the Unix worker pool treats iOS as Apple. Only this helper's text changes; macOS, Linux and Windows codes are unchanged."
regressions = ["src/tests/btrc/test_target_probes.py", "src/tests/python/test_runtime_helper_registry.py", "src/tests/python/test_string_helpers_runtime.py", "src/tests/python/test_boundary_manifest.py", "src/tests/python/test_application_directories_contract.py", "src/tests/btrc/test_native_packages.py"]

