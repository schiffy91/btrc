accepted_sha256 = "66e4f20f6ebf3a0c5bcb156cea0307b0f4b5ca071ba17125dbf14912c9314e8e"
reason = "Runtime helper bytes or generated catalog metadata changed intentionally with the reviewed runtime refactor. CL-P2-02 (PLAN.md D14): the Windows launch seam joins the runtime as the separately compiled windows_os.c object (docs/design/windows-os-services.md, Selection unit). Its SDK-free declarations are the seven sections of the new windows_os.h asset (__btrc_windows_launch_types, __btrc_windows_launch, __btrc_windows_launch_wait, __btrc_windows_launch_copy_output, __btrc_windows_launch_terminate, __btrc_windows_launch_close and __btrc_windows_quote_argv_utf8), appended to both catalogs after every existing helper, so every earlier helper keeps its order; the manifest gains the [[external_objects]] row that binds them to windows_os.c, which links kernel32 on Windows. Only a Windows program that calls ChildProcess.run retains them: every existing helper's text and every Linux, macOS, iOS and Android unit are unchanged. Issue 113: link advapi32 for the implemented owner-only Windows record and append-log security checks in windows_os.c; retain kernel32 and the same external object. Issue 113: register the consumer-only image API, its windows_os.c object dependency and BCrypt library; append four image operations without changing existing helper order. Native Windows qualification remains pending."
regressions = ["src/tests/python/test_runtime_helper_registry.py", "src/tests/python/test_windows_launch_seam.py", "src/tests/python/test_windows_process.py", "src/tests/python/test_boundary_manifest.py", "src/tests/python/test_windows_daemon_image.py"]

[[records]]
id = "runtime-catalog.shared.runtime-metadata.0001"
fixture = "runtime-catalog"
capability = "shared.runtime-metadata"
compiler = "shared"
