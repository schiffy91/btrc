accepted_sha256 = "a579dabaa6c42ffad47c2c63663962a3f3cb8f96454bb5f3a71515c7075185c5"
reason = "Stage 4 D060 (PLAN.md D14): the runtime drops its legacy aliases. The seven never-emitted __btrc_math_* helpers and the __btrc_str_track forwarder and no-op __btrc_str_flush leave core.c, strings.c and the manifest, every adoption is spelled __btrc_string_adopt, and the remaining helpers' catalog orders close up contiguously. Generated C loses only the forwarder definition; behavior is unchanged. Per-thread runtime state moved into the __btrc_tls record declared by __btrc_tls_state (the historical variable names are field accessors, so one thread-local lookup per function replaces one per variable); the Darwin _setjmp mapping is hosted-only; the deferred ARC drain returns without the mutation lock when this thread's queue is empty. The application-directory platform helper is now the general __btrc_target_platform, which Platform.isWindows also reads; it is renamed in place with an override macro to match, so only its name and text change. Merged root-a's __btrc_target_platform rename with root-b's removal of nine unused helpers (2026-10-01 wave-1 integration): the order is the union of both deltas. Stage 4 D051 (PLAN.md D14): the unused __btrc_join helper leaves strings.c and the manifest (Strings.join delegates to Vector.join), and the later helpers' catalog orders close up contiguously; generated C is unchanged because no lowering ever selected it. __btrc_target_architecture joins both catalogs at the end of their orders; every earlier helper keeps its position. Stage 4 C-output parity (PLAN.md D14): both catalogs share one dependency-first order -- the btrc order is the Python order restricted to its members, and the generator rejects a helper ordered before a dependency -- and both compilers materialize a selection's dependency closure in that order, whichever members were roots, so the two compilers emit shared runtime helpers in the same sequence. Helper sources are unchanged; only their order in generated C moves."
