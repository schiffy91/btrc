accepted_sha256 = "a0988ecc330ad854d561ee992448b96588efe55d03b6c8c4b4ff70f023c309f6"
reason = "CL-P2-02 (PLAN.md D14): the Windows launch seam joins the runtime as the separately compiled windows_os.c object (docs/design/windows-os-services.md, Selection unit). Its SDK-free declarations are the seven sections of the new windows_os.h asset (__btrc_windows_launch_types, __btrc_windows_launch, __btrc_windows_launch_wait, __btrc_windows_launch_copy_output, __btrc_windows_launch_terminate, __btrc_windows_launch_close and __btrc_windows_quote_argv_utf8), appended to both catalogs after every existing helper, so every earlier helper keeps its order; the manifest gains the [[external_objects]] row that binds them to windows_os.c, which links kernel32 on Windows. Only a Windows program that calls ChildProcess.run retains them: every existing helper's text and every Linux, macOS, iOS and Android unit are unchanged. The helper is new, so its baseline row is null. Issue 113: document error domain 3 as raw NTSTATUS from inherited-handle admission. Struct fields and ABI layout are unchanged."
regressions = ["src/tests/python/test_windows_launch_seam.py", "src/tests/python/test_windows_process.py", "src/tests/python/test_runtime_helper_registry.py", "src/tests/python/test_boundary_manifest.py"]

