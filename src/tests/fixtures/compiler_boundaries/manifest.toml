baseline_sha256 = "52762df6b9cd76475b536831493ce3a97f92568811a5e3bcbc63301ed371c533"
accepted_path = "accepted/runtime-catalog.shared.runtime-metadata.0001.bin"
accepted_sha256 = "38e0b9de817f645c4bec37c0d4a3e58baecccb040f5718dc069a72c7385a0bed"
reason = "Stage 4 D060 (PLAN.md D14): the runtime drops its legacy aliases. The seven never-emitted __btrc_math_* helpers and the __btrc_str_track forwarder and no-op __btrc_str_flush leave core.c, strings.c and the manifest, every adoption is spelled __btrc_string_adopt, and the remaining helpers' catalog orders close up contiguously. Generated C loses only the forwarder definition; behavior is unchanged. Stage 4 D051 (PLAN.md D14): the unused __btrc_join helper leaves strings.c and the manifest (Strings.join delegates to Vector.join), and the later helpers' catalog orders close up contiguously; generated C is unchanged because no lowering ever selected it. Stage 4 C-output parity (PLAN.md D14): both catalogs share one dependency-first order -- the btrc order is the Python order restricted to its members, and the generator rejects a helper ordered before a dependency -- and both compilers materialize a selection's dependency closure in that order, whichever members were roots, so the two compilers emit shared runtime helpers in the same sequence. Helper sources are unchanged; only their order in generated C moves."
regressions = ["src/tests/python/test_runtime_helper_registry.py", "src/tests/python/test_string_helpers_runtime.py", "src/tests/python/test_boundary_manifest.py", "src/tests/btrc/test_c_output_parity.py"]

