reason = "btrcc infers its host package target from the compiler-owned __btrc_target_architecture discriminator beside __btrc_target_platform, as the reference compiler infers it from its own process; the helper is new, so its baseline row is null. Merged with w2-primitives' removal of __btrc_join (2026-10-02 wave-2 integration): the helper stays last, so its orders become python 222 and btrc 207. Stage 4 C-output parity (PLAN.md D14): __btrc_gpu_index_check joins the btrc catalog at its Python position, so btrcc's @gpu CPU fallback calls the pre-authored bounds check instead of lowering its own __btrc_gpu_checked_index; every later btrc order moves up by one. Helper sources are unchanged."
regressions = ["src/tests/btrc/test_native_packages.py", "src/tests/python/test_runtime_helper_registry.py"]
