[[records]]
id = "runtime-catalog.shared.runtime-metadata.0229"
fixture = "runtime-catalog"
capability = "shared.runtime-metadata"
compiler = "shared"
boundary = "runtime-helper-metadata"
channel = "helper.__btrc_interface_methods"
baseline_path = "baseline/runtime-catalog.shared.runtime-metadata.0229.bin"
baseline_sha256 = "38e0b9de817f645c4bec37c0d4a3e58baecccb040f5718dc069a72c7385a0bed"
accepted_path = "accepted/runtime-catalog.shared.runtime-metadata.0229.bin"
accepted_sha256 = "79e40f4049845a5830b7be081427a36b29f75dc65bda46c76dbc4efd159bd17c"
reason = "Stage 4 D060 (PLAN.md D14): the runtime drops its legacy aliases. The seven never-emitted __btrc_math_* helpers and the __btrc_str_track forwarder and no-op __btrc_str_flush leave core.c, strings.c and the manifest, every adoption is spelled __btrc_string_adopt, and the remaining helpers' catalog orders close up contiguously. Generated C loses only the forwarder definition; behavior is unchanged. Stage 4 D051 (PLAN.md D14): the unused __btrc_join helper leaves strings.c and the manifest (Strings.join delegates to Vector.join), and the later helpers' catalog orders close up contiguously; generated C is unchanged because no lowering ever selected it. Stage 4 C-output parity (PLAN.md D14): __btrc_gpu_index_check joins the btrc catalog at its Python position, so btrcc's @gpu CPU fallback calls the pre-authored bounds check instead of lowering its own __btrc_gpu_checked_index; every later btrc order moves up by one. Helper sources are unchanged."
regressions = ["src/tests/python/test_runtime_helper_registry.py", "src/tests/python/test_string_helpers_runtime.py", "src/tests/python/test_boundary_manifest.py"]

