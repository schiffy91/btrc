[[programs]]
paths = [
    "stdlib/Http.btrc",
    "stdlib/HttpBytesResponse.btrc",
    "stdlib/HttpParseBytes.btrc",
    "stdlib/HttpParseEdges.btrc",
    "stdlib/HttpSocketIo.btrc",
