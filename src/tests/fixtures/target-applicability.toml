# Which corpus programs each compilation target builds and runs (CL-P1-17).
#
# src/tests/target_runner.py reads this beside the corpus.* topic cells of
# docs/design/platform-inventory.toml. A program the target cannot build or
# run is reported, never dropped:
#   restricted  deliberately excluded on that target (an OS restriction or an
#               adaptation contract says so)
#   missing     not implemented there yet; a Stage 25 or 26 fix wave owns it
# scope = "build" keeps a program out of the bundle; scope = "run" builds it
# (compile-only lanes still prove it compiles) and never executes it there.
#
# Each [[programs]] entry lists corpus paths (globs allowed), the targets.toml
# rows and, optionally, the frontends it decides; no two entries may decide
# one program, row and frontend. Every entry states its reason and cites an
# inventory cell of its own row's slice (`corpus.<topic>@<slice>`, a
# TARGET_SLICES name) or a contract (`<repository path>#<anchor>`);
# test_target_runner.py resolves each citation and fails on an entry that
# matches no corpus program. A program an entry does not name, whose topic
# cell is not os-restricted or missing, is applicable: its build or run
# failure is a failure, never an exclusion. Codex lanes propose changes as
# `fragment:` commits (WORKSTREAMS.md section 3.5).

schema = "btrc.target-applicability/1"

# BTRC_TEST_REQUIRES host capabilities, and the executors that grant them. An
# executor that reports granted_capabilities() after prepare (the local
# executor probes the host) answers for itself; for the others this list does.
[[capabilities]]
name = "loopback-listener"
executors = []
reason = "no target executor has proven an IPv4 loopback listener inside its sandbox yet"
cites = "src/tests/runner_capabilities.py#loopback_listener_error"

# The @gpu compute runtime: emitted C that includes btrc_gpu_compute_internal.h
# links libbtrc_gpu over wgpu-native. The host links build/stdlib/GPU when
# `make gpu` built it; no cross row has a runtime build until Stage 28
# (tooling-cross-gpu-deps), so dispatching programs are missing there.
[[facilities]]
name = "compute-runtime"
header = "btrc_gpu_compute_internal.h"
targets = []
status = "missing"
reason = "dispatching @gpu programs need libbtrc_gpu over wgpu-native, which is not built for this row (Stage 28, tooling-cross-gpu-deps)"
cites = "docs/design/platform-inventory.toml#corpus.gpu"

# Windows gnu rows. Established by `--target windows-x86_64 --frontend both
# --compile-only` with zig 0.16.0 on 2026-10-17 (980 of 1,021 programs built
# through each frontend). Every program below fails to compile for MinGW
# because it reaches a POSIX provider the inventory records as lacking its
# Win32 backend. The LP64 programs that also fail there (long is 4 bytes on
# Windows) are not excluded: they are failures for the CL-P1-18 triage.

[[programs]]
paths = [
    "stdlib/AdvisoryFileLockReal.btrc",
    "stdlib/FileSystemHandlesReal.btrc",
    "stdlib/FileTreeSnapshotReal.btrc",
    "stdlib/Fs.btrc",
    "stdlib/FsRemoveRecursive.btrc",
    "stdlib/PrivateDirectoryChild.btrc",
    "stdlib/PrivateDirectoryReal.btrc",
    "stdlib/RegularFileSnapshotReal.btrc",
]
targets = ["windows-x86_64"]
status = "missing"
scope = "build"
reason = "the exact filesystem handles call POSIX symlink() and fcntl(F_GETFD), which MinGW lacks; the Win32 handle provider is platforms-p3-fs-windows (platform adaptations, Windows row 7)"
cites = "corpus.stdlib@windows-x64"

[[programs]]
paths = [
    "stdlib/AdvisoryFileLockReal.btrc",
    "stdlib/FileSystemHandlesReal.btrc",
    "stdlib/FileTreeSnapshotReal.btrc",
    "stdlib/Fs.btrc",
    "stdlib/FsRemoveRecursive.btrc",
    "stdlib/PrivateDirectoryChild.btrc",
    "stdlib/PrivateDirectoryReal.btrc",
    "stdlib/RegularFileSnapshotReal.btrc",
]
targets = ["windows-aarch64"]
status = "missing"
scope = "build"
reason = "the exact filesystem handles call POSIX symlink() and fcntl(F_GETFD), which MinGW lacks; the Win32 handle provider is platforms-p3-fs-windows (platform adaptations, Windows row 7)"
cites = "corpus.stdlib@windows-arm64"

# Library.Process has its Windows provider (CL-P2-02's launch seam under
# CX-P2-06's ProcessHostProvider): ChildProcess, Process, ProcessStatusPipe
# and Shellwords build and run on both Windows rows. What stays out is POSIX
# by contract, or waits on another provider.

[[programs]]
paths = [
    "stdlib/ChildProcessClosedFds.btrc",
    "stdlib/ChildProcessDescriptor.btrc",
    "stdlib/ChildProcessDescriptorMapping.btrc",
]
targets = ["windows-x86_64", "windows-aarch64"]
status = "restricted"
scope = "build"
reason = "POSIX descriptor contracts (descriptor-limit closing after fork, fcntl leases, fexecve); Windows refuses descriptor-backed launches with the platform-adaptations row 1 diagnostic and passes the child only its three stdio handles through STARTUPINFOEX's handle list, both checked natively by test_windows_process.py and test_windows_launch_seam.py"
cites = "docs/design/windows-os-services.md#process-and-shell--rows-1-and-1b"

[[programs]]
paths = ["stdlib/ShellCwdEnv.btrc"]
targets = ["windows-x86_64", "windows-aarch64"]
status = "restricted"
scope = "run"
reason = "the program exercises UnixShell's cwd and environment through /bin/sh; Windows refuses UnixShell.run (platform adaptations, Windows row 1b), which Process, Shellwords and ChildProcess check there"
cites = "docs/design/windows-os-services.md#process-and-shell--rows-1-and-1b"

[[programs]]
paths = ["stdlib/ImagePpm.btrc"]
targets = ["windows-x86_64", "windows-aarch64"]
status = "restricted"
scope = "build"
reason = "the program provokes a short write by lowering RLIMIT_FSIZE with setrlimit, which Windows has no counterpart for"
cites = "docs/design/windows-os-services.md#process-and-shell--rows-1-and-1b"

[[programs]]
paths = ["stdlib/Daemon.btrc"]
targets = ["windows-x86_64"]
status = "missing"
scope = "build"
reason = "DaemonControlFiles checks uid_t ownership and the supervisor is a /bin/sh script; the native Windows supervisor is CX-P2-08 (platform adaptations, Windows row 4)"
cites = "corpus.stdlib@windows-x64"

[[programs]]
paths = ["stdlib/Daemon.btrc"]
targets = ["windows-aarch64"]
status = "missing"
scope = "build"
reason = "DaemonControlFiles checks uid_t ownership and the supervisor is a /bin/sh script; the native Windows supervisor is CX-P2-08 (platform adaptations, Windows row 4)"
cites = "corpus.stdlib@windows-arm64"

[[programs]]
paths = ["stdlib/HttpClientLocal.btrc"]
targets = ["windows-x86_64"]
status = "missing"
scope = "run"
reason = "its curl stand-in is a /bin/sh script on PATH; the Windows HTTP transport is WinHTTP (platforms-p3-sockets-http, platform adaptations, Windows rows 6 and 10)"
cites = "corpus.stdlib@windows-x64"

[[programs]]
paths = ["stdlib/HttpClientLocal.btrc"]
targets = ["windows-aarch64"]
status = "missing"
scope = "run"
reason = "its curl stand-in is a /bin/sh script on PATH; the Windows HTTP transport is WinHTTP (platforms-p3-sockets-http, platform adaptations, Windows rows 6 and 10)"
cites = "corpus.stdlib@windows-arm64"

[[programs]]
paths = ["stdlib/HttpFramingSafety.btrc"]
targets = ["windows-x86_64"]
status = "missing"
scope = "build"
reason = "DescriptorFlags.closeOnExec calls fcntl(F_GETFD) on a BSD socket; the Winsock provider is platforms-p3-sockets-http (platform adaptations, Windows rows 6 and 10)"
cites = "corpus.stdlib@windows-x64"

[[programs]]
