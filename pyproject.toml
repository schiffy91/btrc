[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "btrc"
version = "0.1.2"
description = "A language that transpiles to C"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ["lsprotocol>=2023.0.0", "pygls>=2.0.0"]

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "pytest>=7.0",
    "pytest-xdist>=3.0",
    "ruff>=0.1.0",
    "setuptools>=77.0",
]

[project.scripts]
btrcpy = "src.compiler.python.main:main"
btrc-lsp = "src.devex.lsp.__main__:main"
btrc-format = "src.devex.formatter.cli:main"

# The project intentionally imports through the repository-level `src`
# namespace (for example, `src.compiler.python.main`).  Setuptools' implicit
# src-layout discovery strips that namespace, producing a wheel whose entry
# points cannot import their targets.  Discover from the repository root and
# keep generated extension payloads and test-only packages out of the wheel.
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = [
    "src.tests*",
    "src.devex.vscode*",
]
namespaces = true

# Grammar, ASDL, stdlib, and native-runtime sources are runtime inputs, not
# incidental repository files.  Each data-bearing directory is discovered as
# a namespace package, so these per-package globs include the complete source
# payload without admitting build products such as .o/.a files.
[tool.setuptools.package-data]
"*" = [
    "*.asdl",
    "*.btrc",
    "*.c",
    "*.ebnf",
    "*.h",
    "*.m",
    "*.md",
    "*.sh",
    "*.toml",
    "*.txt",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["."]
# Test directories are namespace-package-free by design, so prepend mode would
# import duplicate basenames as the same top-level module. Importlib mode gives
# each collected file a path-derived identity without requiring __init__.py.
addopts = ["--import-mode=importlib"]
# `runner.py` holds the parametrized language-corpus tests but doesn't match the
# default `test_*.py` glob, so directory collection (`pytest src/tests/`, which
# `make test` runs) silently skipped the entire language corpus. Collect it too.
python_files = ["test_*.py", "*_test.py", "runner.py"]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [
    # Generated verbatim from the ASDL and stdlib specifications. Keeping the
    # checked-in files byte-identical to their generators is more important
    # than applying a second, non-authoritative formatting pass.
    "src/compiler/python/abi/generated.py",
    "src/compiler/python/syntax/ast/generated.py",
    "src/compiler/python/runtime/generated.py",
    "src/compiler/btrc/generated/runtime/catalog.btrc",
    "src/devex/lsp/catalog/generated.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E402",   # scripts use sys.path.insert() before imports — unavoidable
    "E501",   # line-length already set to 120; remaining cases are strings/comments
    "E701",   # compact one-liners (e.g. `if x: return`) used idiomatically throughout
    "SIM102", # nested ifs are often more readable than long `and` chains in parser/analyzer
    "SIM108", # ternary expressions less readable for multi-line conditions
    "UP007",  # Optional[X] / Union[X, Y] is more explicit; used consistently in codebase
    "UP045",  # same as UP007 — keep Optional[X] over X | None
    "UP015",  # open("r") vs open() — explicit mode is clearer
    "B905",   # zip(strict=True) not needed — lengths are always matched by construction
    "RUF005", # [a] + list is clearer intent than [a, *list] for concatenation patterns
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pyright]
extraPaths = ["."]
pythonVersion = "3.13"
