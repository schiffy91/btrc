configuration = "AppKit native provider"
note = "src/stdlib/GUI/MacOS/MacOSImageHandle.btrc: source implements this operation. Dimensions remain metadata after close. Worker creation is tested; this does not establish simultaneous close/use safety across threads. Closing an already-bound handle stops Linux painting, while AppKit retains its assigned NSImage; closed-handle rebinding is rejected only by AppKit. Assertion: NativeGUI.btrc verifyImageHandles: worker-created 8x4 dimensions and open state match; two closes are safe, isOpen becomes false and rebinding the closed handle is rejected. UI2 changes this contract as recorded in ui2-approved.md; earlier evidence covers the previous behavior only. The expanded UI2 behavior awaits atomic provider acceptance."
