# Host routing, not an execution ledger. available means an eligible host, never a pass.
# Both frontends must run independently. No environment is promoted to physical evidence.
schema = "btrc.ui-hosts/2"
recorded_at = "2026-10-05"
platforms = ["macos", "linux", "windows", "ios", "android"]
frontends = ["reference", "selfhost"]
evidence_classes = ["automation", "accessibility-tree", "assistive-technology", "physical-input-ime", "gpu"]

[disk_budget]
stage23_minimum_free_gb = 150
stage23_basis = "D8 provisioning prerequisite: 150 GB free or external SSD before new SDK/runtime downloads."
historical_stage0_minimum_free_gb = 100
android_sdk_ndk_avd_estimate_gb = [10, 15]
android_platforms_closure_gb = 17.75
ios_runtime_budget = "Variable per installed Xcode runtime/destination; measure actual free and allocated space, do not assume a fixed size."
note = "The older 10–15 GB Android estimate excludes the full 17.75 GB platforms closure and extra AVDs. Re-check disk before downloads; this packet installs no runtimes."

