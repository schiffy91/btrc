# P0 platform parity inventory (PLAN.md Stage 22, platforms-p0-inventory).
#
# A btrc.qualification.ledger/1 ledger (tools/qualification/schema.py): one
# `operation` record per operation and target slice. The slices are the six
# TARGET_SLICES -- windows x86_64/arm64, ios arm64-device/arm64-simulator,
# android arm64/x86_64 -- each recorded as its platform family plus artifact
# variant, so simulator and device rows never merge.
#
# The operations are derived, not chosen (src/tests/python/test_platform_inventory.py
# recomputes them and fails on drift):
#   Library.*   every export of src/stdlib/btrc.toml and of each group
#               btrc.toml, as its import path; the App, GUI, Tray and UI
#               groups belong to UI0 and are referenced through its frozen
#               family-cell, ui-operation and ui-case denominators instead
#   runtime.*   every [[helpers]] entry of src/runtime/c/manifest.toml
#   corpus.*    every corpus topic directory under src/tests
# BTRSmith's journeys and native package contracts are classified in the
# private BTRSmith repository (btrsmith-p0-inventory) and are not copied here.
#
# Each record carries its class (classification.parity: equivalent, adapted,
# os-restricted, missing), the source state on that slice
# (classification.implementation), its owner (the platform-parity.md
# milestone: P2, P3, P4, W1, W2, I1, I2, A1, A2), the tests that pin it today
# (classification.regression) and its current evidence. No slice result has
# been ingested yet, so nothing is `passed`: implemented rows are
# `implemented-unverified`, and missing or OS-restricted rows are
# `source-only` with the reason. The frozen denominator is the `operation`
# entry of tools/qualification/denominators.toml; the per-class totals are in
# docs/design/platform-parity.md, "P0 inventory".
#
# Classified from the source at btrc c7f785e on 2026-10-02.

schema = "btrc.qualification.ledger/1"

