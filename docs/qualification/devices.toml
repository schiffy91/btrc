# Device registry: every physical qualification gate mapped to a named device
# or to an explicit unavailable record (PLAN.md Stage 22, `qualification-device-lab`).
#
# Decision D8: no procurement and no account creation by an agent. A device
# the owner does not have is recorded `status = "unavailable"` with the
# provisioning or account item that blocks it; it is never counted as met.
# Simulators, emulators and hosted CI runners are recorded as `stand_in` on
# the physical row they partly cover, never as the physical device itself.
#
# Checked by src/tests/python/test_device_registry.py. Every id in `gates`,
# `blocked_by` and `[physical_gates]` is a PLAN.md item id.
#
# Fields of a [[device]]:
#   id          stable kebab-case key
#   class       a [device_class] key
#   status      "available" (named, owner has it), "unverified" (named, a
#               fact still needs one read-only probe on the Mac) or
#               "unavailable" (no device; blocked_by names why)
#   name        what the device is; for an unavailable row, what is needed
#   gates       PLAN.md item ids this device carries evidence for
#   blocked_by  (unavailable, unverified) PLAN.md item ids that must close first
#   reason      (unavailable, unverified) one line: why, citing D8 where it applies
#   verify      (unverified) the read-only command that settles it
#   stand_in    (optional) what runs meanwhile; never physical evidence

