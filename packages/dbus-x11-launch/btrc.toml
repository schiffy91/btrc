manifest-version = 1

[package]
name = "dbus_x11_launch"
exports = ["DBusX11Launch"]

[[package.providers]]
module = "DBusX11Launch"
implementation = "Linux.Install"
os = ["linux"]

[[package.providers]]
module = "DBusX11Launch"
implementation = "System"
os = ["macos", "ios", "android", "windows"]

[[native.bindings]]
module = "Linux.Install"
header = "Linux/Install.h"
language = "c"
standard = "c11"
symbols = ["btrcDBusX11LaunchInstall", "btrcDBusX11LaunchAvailable"]
os = ["linux"]

[[native.sources]]
path = "Linux/Backend.c"
language = "c"
standard = "c11"
modules = ["Linux.Install"]
os = ["linux"]
