# The devcontainer's /etc/asound.conf. The container has no sound card, so
# this replaces the default PCM with alsa-lib's null plugin: playback discards
# samples and capture reads silence, in both directions at any channel count,
# rate and period. The ALSA provider's session tests then run here and in CI's
# Linux shards against real alsa-lib without hardware. The null plugin is not
# paced by a clock, so those runs prove the provider's ALSA calls, lifecycle
# and frame accounting, not realtime scheduling.
pcm.!default {
	type null
	hint.description "Null PCM (btrc devcontainer)"
}
