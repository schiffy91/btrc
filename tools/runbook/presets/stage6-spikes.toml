# Stage 6: per-file-cache floor spikes (PLAN.md Stage 6 `perf-floor-spikes`; CL-R-05, run by MAC-R-03).
#
#   tools/runbook/run.sh stage6-spikes stage6-reference stage6-native
#
# On the Mac: builds a clang -O2 btrcc from the spikes' base and from each
# never-merged spike branch (spike/stage6-{decl,parse,instances,records,
# visibility,composed}), then counts instructions retired at --jobs 1 for
# budget_bench's three private-body edit fixtures with each binary
# (tools/bench/scripts/edit_instr.py, every fixture from the same primed cache
# snapshot), checks that every spike emits the base's units, and times the
# composed spike once end to end on a quiet machine. Instruction cells are
# single-thread algorithmic cuts, so they tolerate light load (PLAN.md
# "Throwaway experiments"); only the wall-clock cell waits for quiet.
#
# The spikes are deliberately unsound caches; their only output is these
# numbers. CL-R-08 turns instructions.json into the separate-compilation.md
# lever table and the D12 resident-compiler decision. Each spike branch's
# commit message records what it skips and why its key is unsound.
#
# In a container: tools/runbook/run.sh stage6-spikes --rehearsal --stand-in --dry-run
# builds every variant with the host cc and times the composed spike on
# budget_bench's stand-in; the instruction and identity cells need BTRSmith
# and macOS (`cp -c`, `/usr/bin/time -l`) and are skipped there.

[preset]
title = "Stage 6 per-file-cache floor spikes (instructions retired per lever, composed wall clock)"
packet = "MAC-R-03"
kind = "measurement"
# Instruction counts at --jobs 1 tolerate light load; the composed wall-clock cell asks for quiet itself.
quiet = false
on_failure = "continue"
before = [
  "put Stage 5's BTRSmith pin in --btrsmith-branch if BTRSmith main has moved since MAC-R-02",
  "for the composed wall-clock cell: stop the podman machine (`podman machine stop`) and every agent session, build and guest; it waits for a quiet 60 s window",
]
next_action = "nothing: CL-R-08 reads cells/table/summary.txt (the deltas, then instructions.json) and cells/composed-wall/summary.txt on the evidence branch for the Stage 6 lever table and D12."

[btrc]
# The measurement scripts come from main; every binary is built from its own tree below.
ref = "main"

[btrsmith]
# The pin Stage 5 measured: BTRSmith main after MAC-R-01's fast-forward push.
pins = { post-stage4 = "main" }
branch_pin = "post-stage4"

[variables]
# The spikes' common base: origin/main-kn9jxh when CL-R-05 cut them. A rebase of
# the spike branches moves this SHA, and base_tree below, with them.
ref_base = "8dd6d1cda3b4df73844daf7367b5a035fcaf0386"
ref_decl = "spike/stage6-decl"
ref_parse = "spike/stage6-parse"
ref_instances = "spike/stage6-instances"
ref_records = "spike/stage6-records"
ref_visibility = "spike/stage6-visibility"
ref_composed = "spike/stage6-composed"
# The clang -O2 btrcc of each tree (Apple clang on the Mac; docs/design/compile-performance.md "Measuring a compile"),
# called with the output binary and the host entry. Variables expand in every
# cell, so they never name a matrix value such as {lever}.
spike_build = '"{scripts}/build_btrcc.sh"'
# Every binary compiles against the base tree's stdlib (the spikes change no
# stdlib or runtime file), so --debug paths in the units are the same for
# every lever and cmp_units.py compares them as they are. The engine checks
# a tree out at {run}/trees/<first 12 hex digits of its SHA>.
base_tree = "{run}/trees/8dd6d1cda3b4"
fixtures = "audio-preparation,navigation,ui-controller"
# Each repeat is one more revision of every fixture from the same primed snapshot.
instr_repeat = "3"
wall_samples = "20"

[rehearsal.variables]
# build_btrcc.sh links for Apple clang (no -lm); off the Mac a rehearsal builds each tree with `make btrcc`.
spike_build = """sh -c 'make NIX= btrcc && cp bin/btrcc "$0" && echo "BUILD OK $0 (make btrcc, rehearsal)"'"""
instr_repeat = "1"
wall_samples = "1"

[stand_in]
collapse = ["pin"]

[quiet]
# Overridden locally by ~/.cache/btrc/runbook/quiet.toml (README.md).
window_s = 60
interval_s = 5

[[cell]]
id = "build-{lever}"
title = "build the clang -O2 btrcc of {lever} ({ref_{lever}})"
matrix = { lever = ["base", "decl", "parse", "instances", "records", "visibility", "composed"] }
tree = "{ref_{lever}}"
cwd = "tree"
lock = "btrcc-build"
timeout_hours = 2
env = { BTRC_REPO = "{tree}" }
command = ["sh", "-c", 'mkdir -p "{run}/spikes/{lever}" && {spike_build} "{run}/spikes/{lever}/btrcc" "{host_entry}"']

[[cell]]
id = "instr-{lever}"
title = "instructions retired at --jobs 1 for the three body-edit fixtures, {lever} btrcc"
matrix = { lever = ["base", "decl", "parse", "instances", "records", "visibility", "composed"] }
tree = "{ref_{lever}}"
lock = "bench"
shell = "btrsmith"
stand_in = "skip"
# gate-summary stages out/summary.txt (here edit_instr.py's output) on the evidence branch.
result = "gate-summary"
timeout_hours = 3
# BTRC_BENCH_HOME moves edit_instr.py's workspace into this cell; bsm_env.sh
# would follow it, so the measured PKG_CONFIG_PATH is named explicitly.
env = { BTRC_BENCH_HOME = "{out}", BSM_WORKSPACE = "{btrsmith}", BTRC_REPO = "{base_tree}", BSM_PKG_CONFIG_PATH = "{home}/measure/bsm-pkg-config-path.txt" }
command = [
  "bash", "-c",
  'set -o pipefail; python3 "{scripts}/edit_instr.py" "{run}/spikes/{lever}/btrcc" "{lever}" --prime --jobs 1 --fixtures "{fixtures}" --repeat "{instr_repeat}" 2>&1 | tee "{out}/instr.txt"; code=$?; cp "{out}/instr.txt" "{out}/summary.txt"; exit $code',
]

[[cell]]
id = "identity-{lever}"
title = "the {lever} spike emits the base's module units for the last fixture edit (cmp_units.py)"
matrix = { lever = ["decl", "parse", "instances", "records", "visibility", "composed"] }
stand_in = "skip"
result = "gate-summary"
timeout_hours = 1
command = [
  "sh", "-c",
  'python3 "{scripts}/cmp_units.py" "{cell:instr-base}/perf/ei-base" "{cell:instr-{lever}}/perf/ei-{lever}" > "{out}/summary.txt"; cat "{out}/summary.txt"; grep -q "name differences set()$" "{out}/summary.txt" && grep -q "^differing 0 " "{out}/summary.txt"',
]

[[cell]]
id = "table"
title = "per-lever instructions-retired deltas against the base, as JSON"
stand_in = "skip"
# out/summary.txt carries the delta lines and the whole instructions.json to the evidence branch.
result = "gate-summary"
timeout_hours = 1
command = [
  "python3", "-c",
  """
import json, re, sys
from pathlib import Path
levers = ["base", "decl", "parse", "instances", "records", "visibility", "composed"]
cells = dict(zip(levers, sys.argv[1:8]))
out = Path(sys.argv[8])
pattern = re.compile(r"^(\\S+) jobs=1 (\\S+) wall=([0-9.]+)s instr=([0-9.]+|nan)G peak=([0-9.]+|nan)GiB")
table = {}
for lever, cell in cells.items():
    rows = {}
    for line in (Path(cell) / "instr.txt").read_text().splitlines():
        match = pattern.match(line)
        if match:
            rows.setdefault(match[2], []).append({"wall_s": float(match[3]), "instructions_g": float(match[4]), "peak_gib": float(match[5])})
    table[lever] = rows
base = table["base"]
deltas = {}
for lever in levers[1:]:
    deltas[lever] = {}
    for fixture, rows in table[lever].items():
        before = min(row["instructions_g"] for row in base.get(fixture, [{"instructions_g": float("nan")}]))
        after = min(row["instructions_g"] for row in rows)
        deltas[lever][fixture] = {"base_g": before, "spike_g": after, "delta_g": after - before, "ratio": after / before if before else None}
out.mkdir(parents=True, exist_ok=True)
(out / "instructions.json").write_text(json.dumps({"schema": 1, "metric": "instructions retired, --jobs 1, min over repeats", "samples": table, "deltas": deltas}, indent=2, sort_keys=True) + "\\n")
lines = [lever + " " + " ".join("%s=%+.2fG" % (name, row["delta_g"]) for name, row in sorted(fixtures.items())) for lever, fixtures in deltas.items()]
print("\\n".join(lines))
(out / "summary.txt").write_text("\\n".join(lines) + "\\n\\n" + (out / "instructions.json").read_text())
""",
  "{cell:instr-base}", "{cell:instr-decl}", "{cell:instr-parse}", "{cell:instr-instances}",
  "{cell:instr-records}", "{cell:instr-visibility}", "{cell:instr-composed}", "{out}",
]

[[cell]]
id = "composed-wall"
title = "one quiet wall-clock run of the composed spike on the three body-edit fixtures (budget_bench edit)"
# budget_bench pairs the binary with its own tree's stdlib: run it from the composed tree.
tree = "{ref_composed}"
cwd = "tree"
lock = "bench"
quiet = true
shell = "btrsmith"
# Not budget-bench: that result is ingested into the qualification ledger, and
# these are a never-merged spike's timings. summary.txt carries each edit
# scenario's median, p95 and max, then the whole report.json.
result = "gate-summary"
timeout_hours = 4
command = [
  "bash", "-c",
  'python3 -m tools.budget_bench --btrcc "{run}/spikes/composed/btrcc" {workspace_args} --out "{out}" --frontend selfhost --scenarios edit --incremental-samples "{wall_samples}" {dry_run_args}; code=$?; python3 -c "$0" "{out}" || code=1; exit $code',
  """
import json, sys
from pathlib import Path
out = Path(sys.argv[1])
report = json.loads((out / "report.json").read_text())
lines = []
for name, row in sorted(report.get("scenarios", dict()).items()):
    lines.append("%s exit=0 0s median=%s p95=%s max=%s samples=%d" % (name, row.get("median"), row.get("p95"), row.get("max"), len(row.get("samples", []))))
failure = report.get("failure")
if failure:
    lines.append("failure exit=1 0s " + str(failure))
(out / "summary.txt").write_text("\\n".join(lines) + "\\n\\n" + json.dumps(report, indent=2, sort_keys=True) + "\\n")
print("\\n".join(lines))
sys.exit(1 if failure else 0)
""",
]
