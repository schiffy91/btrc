label = "reference compiler peak <= 1.5 GiB"

[[cell]]
id = "gate"
title = "full D5 gate on the final SHA, the Mac's test-c11 included, with BTRSmith's frontend check and library smoke"
lock = "gate"
result = "gate-summary"
stand_in = "skip"
timeout_hours = 12
command = ["{scripts}/batch_gate.sh", "{btrc}", "{out}", "{gate_base}", "{btrsmith}"]

[[cell]]
id = "determinism"
title = "determinism tier: module-unit self-compile byte-stable across workers and shuffles"
lock = "gate"
requires = ["make:test-determinism"]
timeout_hours = 6
command = ["make", "test-determinism"]

[[cell]]
id = "btrcc"
title = "build the clang -O2 btrcc every timing names"
provides = "btrcc"
lock = "btrcc-build"
timeout_hours = 2
env = { BTRC_REPO = "{btrc}" }
command = ["sh", "-c", "{btrcc_build}"]

[[cell]]
id = "product-{group}-{pin}-{frontend}"
title = "final quiet {group} scenarios, {frontend} frontend, BTRSmith {pin}"
matrix = { pin = ["final"], frontend = ["selfhost", "reference"], group = ["cold", "edits", "steady"] }
lock = "bench"
quiet = true
shell = "btrsmith"
result = "budget-bench"
timeout_hours = 6
command = [
  "python3", "-m", "tools.budget_bench", "{btrcc_args}", "{workspace_args}", "--out", "{out}",
  "--frontend", "{frontend}", "--scenarios", "{scenarios_{group}}",
  "--cold-samples", "{cold_samples}", "--incremental-samples", "{incremental_samples}",
  "--native-jobs", "{native_jobs}", "--workers", "{workers}", "--timing-cold", "{dry_run_args}",
]

[[cell]]
id = "batch-{pin}-{frontend}"
title = "final quiet warm batch, {frontend} frontend, BTRSmith {pin}"
matrix = { pin = ["final"], frontend = ["selfhost", "reference"] }
lock = "bench"
quiet = true
shell = "btrsmith"
result = "budget-bench"
stand_in = "skip"
timeout_hours = 4
command = [
  "python3", "-m", "tools.budget_bench", "{btrcc_args}", "{workspace_args}", "--out", "{out}",
  "--frontend", "{frontend}", "--scenarios", "batch", "--cold-samples", "{cold_samples}",
  "--native-jobs", "{native_jobs}", "{dry_run_args}",
]

[[cell]]
id = "make-noop-{pin}-{frontend}"
title = "final product-Make no-op, {frontend} frontend, BTRSmith {pin}"
matrix = { pin = ["final"], frontend = ["selfhost", "reference"] }
lock = "bench"
quiet = true
shell = "btrsmith"
result = "budget-bench"
stand_in = "skip"
timeout_hours = 2
command = [
  "python3", "-m", "tools.budget_bench", "{btrcc_args}", "{workspace_args}", "--out", "{out}",
  "--frontend", "{frontend}", "--entry", "make", "--scenarios", "noop",
  "--incremental-samples", "{incremental_samples}", "--native-jobs", "{native_jobs}", "{dry_run_args}",
]

[[cell]]
id = "scaling-{frontend}"
title = "final self-compile and full-corpus wall/RSS, {frontend} frontend (5% of Stage 5)"
matrix = { frontend = ["selfhost", "reference"] }
lock = "bench"
quiet = true
shell = "btrsmith"
result = "budget-bench"
timeout_hours = 8
command = [
  "python3", "-m", "tools.budget_bench", "{btrcc_args}", "{workspace_args}", "--out", "{out}",
  "--frontend", "{frontend}", "--scenarios", "self-compile,corpus", "--cold-samples", "{cold_samples}",
  "--corpus-jobs", "{corpus_jobs}", "{dry_run_args}",
]
