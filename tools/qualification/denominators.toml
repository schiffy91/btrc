# Frozen inventory denominators (tools/qualification/denominators.py).
#
# Each entry is immutable for its release: a source that yields other ids
# fails test_the_tracked_denominators_match_their_sources until the entry is
# re-frozen with a new release, id count, slot count and sha256 -- a reviewed
# change, never a side effect of deleting a row.
#
# The three UI0 denominators come from the 2026-09-21 source inventory (btrc
# 4e5c982). The ui-operation and ui-case ids are read from the UI0 seed
# ledger, docs/design/native-ui-catalog.toml, which holds exactly those
# releases' slots (moved off the Markdown checklists by CL-UIA-24 with the
# same ids and sha256). The family-cell ids still come from the N-rows of
# native-ui-parity.md until docs/design/native-ui-catalog/families.toml
# lands. A kind may hold several releases, one entry each; a re-freeze is a
# new reviewed entry beside the old one, and every entry here is in force.
# P0's operation denominator is its compact inventory ledger,
# docs/design/platform-inventory.toml, frozen per target slice on 2026-10-02
# (btrc c7f785e): 84 stdlib exports outside UI0's groups, 223 runtime
# helpers and 16 corpus topics. BTRSmith's journey denominator is frozen in
# the private BTRSmith repository (btrsmith-p0-inventory), not here.

schema = "btrc.qualification.denominators/1"

