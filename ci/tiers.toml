# A stored C window subclass from the real MinGW commctrl.h and real COM (a
# registry-free server DLL with a BTRC sink, an ole32 stream), the overlay's
# regex, fnmatch and glob, the console terminal, Library.Process's
# CreateProcessW provider (the runtime seam's harness, the Process fixture and
# the Process corpus bundle), Windows FileSystem and HTTP provider cases and
# corpus bundles, and the Win32 GUI shell with its UI Automation client
# (CX-UIA-15). The native rows retain a skip report. A Linux runner builds both
# compilers' executables and the server (win32-native-build), then each
# Windows runner executes those of its architecture (win32-native). A job
# that waits on another must run on exactly the same events
# (test_ci_workflow_contracts.py).
[[jobs]]
workflow = "windows.yml"
job = "win32-native-build"
tiers = ["main", "extended", "release"]
changed_tiers = ["pr", "lane"]
changed_paths = [
  "src/tests/python/test_native_win32_subclass.py",
  "src/tests/python/test_native_com_windows.py",
  "src/tests/python/test_regex_parity.py",
