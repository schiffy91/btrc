# The whole language and stdlib corpus on real Windows through both compilers
# (CX-P1-07): a Linux runner cross-builds every applicable program for both
# Windows rows (target-corpus-build, src/tests/target_runner.py
# --compile-only), then each Windows runner executes its own row's bundle
# through the windows-native executor (target-corpus) and publishes the
# per-frontend passed/failed/restricted/missing counts, its JUnit file and
# its ledger records. Both rows report only (their job may fail without
# failing the windows.yml run) until the CL-P1-18 fix waves leave no failure;
# flip report_only to "false" then. The producer and its consumer run on
# exactly the same events.
[[jobs]]
workflow = "windows.yml"
job = "target-corpus-build"
tiers = ["main", "extended", "release"]
changed_tiers = ["pr", "lane"]
changed_paths = [
  "**/Windows/**",
  "tools/target_hosts/windows/**",
  "src/tests/target_runner.py",
  "src/tests/fixtures/target-applicability.toml",
  "docs/design/platform-inventory.toml",
]

[[jobs]]
workflow = "windows.yml"
job = "target-corpus"
key = "target"

[[shards]]
job = "windows.yml/target-corpus"
target = "windows-x64"
label = "windows-x86_64"
runner = "windows-latest"
python = "x64"
report_only = "true"
tiers = ["main", "extended", "release"]
changed_tiers = ["pr", "lane"]
changed_paths = [
  "**/Windows/**",
  "tools/target_hosts/windows/**",
  "src/tests/target_runner.py",
  "src/tests/fixtures/target-applicability.toml",
  "docs/design/platform-inventory.toml",
]

[[shards]]
job = "windows.yml/target-corpus"
target = "windows-arm64"
label = "windows-aarch64"
runner = "windows-11-arm"
python = "arm64"
report_only = "true"
tiers = ["main", "extended", "release"]
changed_tiers = ["pr", "lane"]
changed_paths = [
  "**/Windows/**",
  "tools/target_hosts/windows/**",
  "src/tests/target_runner.py",
  "src/tests/fixtures/target-applicability.toml",
  "docs/design/platform-inventory.toml",
]

[[jobs]]
workflow = "windows.yml"
job = "bootstrap"
tiers = ["main", "extended", "release"]
reports = ["skip-report"]

# ------------------------------------------------------- host-android.yml ---
# Only the corpus lane of host-android.yml is tiered; its CX-P1-05 fixture and
# JNI jobs run on the workflow's paths alone, and its scope job plans just
# these. The whole language and stdlib corpus through both compilers
# (CX-P1-09): target-corpus-build cross-builds every applicable program for
# android-x86_64 with the pinned NDK (src/tests/target_runner.py
# --compile-only), target-corpus runs that bundle on a KVM x86_64 emulator of
# the row's API through the android-emulator executor and publishes the
# per-frontend passed/failed/restricted/missing counts, its JUnit file and its
# ledger records, and target-corpus-compile builds android-aarch64, which no
# hosted runner executes natively (the android-device hardware entry). The
# emulator rows, API 29 (the row's minimum) and API 36, report only (their job
# may fail without failing the run) until the triage's failures are fixed;
# flip report_only to "false" then. The
# workflow's own paths must include every changed_paths entry here. The
# producer and its consumer run on exactly the same events.
[[jobs]]
workflow = "host-android.yml"
job = "target-corpus-build"
tiers = ["main", "extended", "release"]
changed_tiers = ["pr", "lane"]
changed_paths = [
  "**/Android/**",
  "tools/target_hosts/android/**",
  "tools/target_hosts/summary.py",
  "src/tests/target_runner.py",
  "src/tests/fixtures/target-applicability.toml",
  "docs/design/platform-inventory.toml",
  ".github/workflows/host-android.yml",
]

[[jobs]]
workflow = "host-android.yml"
job = "target-corpus-compile"
tiers = ["main", "extended", "release"]
changed_tiers = ["pr", "lane"]
changed_paths = [
  "**/Android/**",
  "tools/target_hosts/android/**",
  "tools/target_hosts/summary.py",
  "src/tests/target_runner.py",
  "src/tests/fixtures/target-applicability.toml",
  "docs/design/platform-inventory.toml",
  ".github/workflows/host-android.yml",
]

[[jobs]]
workflow = "host-android.yml"
job = "target-corpus"
key = "target"

[[shards]]
job = "host-android.yml/target-corpus"
target = "android-x64-api29"
label = "android-x86_64"
api = "29"
runner = "ubuntu-latest"
report_only = "true"
tiers = ["main", "extended", "release"]
changed_tiers = ["pr", "lane"]
changed_paths = [
  "**/Android/**",
  "tools/target_hosts/android/**",
  "tools/target_hosts/summary.py",
  "src/tests/target_runner.py",
  "src/tests/fixtures/target-applicability.toml",
  "docs/design/platform-inventory.toml",
  ".github/workflows/host-android.yml",
]

