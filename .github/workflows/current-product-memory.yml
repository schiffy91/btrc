          """Reuse existing diagnostic assertions without building unrelated inspection tools."""
          import json
          import os
          from pathlib import Path
          import sys
          
          import pytest
          
          REPO = Path(os.environ['TOKEN_LIFETIME_REPO'])
          sys.path.insert(0, str(REPO))
          from src.tests.btrc import test_lexer_diagnostics as lexer
          from src.tests.btrc import test_parser_diagnostics as parser
          
          CANDIDATE = Path(os.environ['BTRC_TEST_BTRCC'])
          OUT = Path(__file__).resolve().parent
          
          # Retain each subprocess's original output; the repository assertions remain
          # unchanged and receive only the already-built production compiler they need.
          def traced(original, kind):
              def run(command, **kwargs):
                  result = original(command, **kwargs)
                  with (OUT / 'diagnostic-processes.jsonl').open('a') as log:
                      log.write(json.dumps({'kind':kind,'command':command,'returncode':result.returncode,'stdout':result.stdout,'stderr':result.stderr})+'\n')
                  return result
              return run
          
          lexer._run = traced(lexer._run, 'lexer')
          parser._run = traced(parser._run, 'parser')
          
          @pytest.mark.parametrize('source,diagnostic', lexer.INVALID_INPUTS)
          def test_reference_lexer_contract(source, diagnostic):
              lexer.test_reference_lexer_matches_diagnostic_contract(source, diagnostic)
          
          @pytest.mark.parametrize('source,diagnostic', lexer.INVALID_INPUTS)
          def test_production_lexer_failure(tmp_path, source, diagnostic):
              lexer.test_invalid_input_fails_closed_at_every_driver({'compiler':CANDIDATE},tmp_path,'compiler',source,diagnostic)
          
          @pytest.mark.parametrize('source,expected', parser.INVALID_PROGRAMS)
          def test_production_parser_failure(tmp_path, source, expected):
              parser.test_invalid_program_stops_at_parser_boundary({'compiler':CANDIDATE},tmp_path,'compiler',source,expected)
          
          def test_production_interpolation_failure(tmp_path):
              lexer.test_invalid_fstring_interpolation_propagates_sublexer_failure({'compiler':CANDIDATE},tmp_path,'compiler')
          
          def test_production_string_literal_survives_parse_scope(tmp_path):
