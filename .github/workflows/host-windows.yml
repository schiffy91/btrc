name: Windows ProcessThreads native qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-process-threads-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            python_arch: x64
          - runner: windows-11-arm
            arch: arm64
            python_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Preserve exact source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: schiffy91/btrc
          ref: 61ffac926e48198d639b8c23d08d1e9e7a8ffd39
          path: compiler
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python_arch }}
      - name: Materialize sealed projection inputs
        run: |
          @'
          import base64,gzip,hashlib,json
          from pathlib import Path
          raw=base64.b64decode("")
          assert hashlib.sha256(raw).hexdigest()=="c42b587713a4b57d118c7a6727f8423b14d409a8041fed2aba1427a33c747e91"
          root=Path("inputs");root.mkdir(exist_ok=False)
          for name,value in json.loads(gzip.decompress(raw)).items():
              path=root/name
              assert path.resolve().is_relative_to(root.resolve())
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(base64.b64decode(value))
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install existing test-owner dependencies and authenticated GNU toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install './compiler[dev]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pins = Get-Content inputs/qualification.json -Raw | ConvertFrom-Json
          $tool = $pins.toolchains.'${{ matrix.arch }}'
          New-Item -ItemType Directory -Path downloads | Out-Null
          Invoke-WebRequest -Uri $tool.url -OutFile downloads/zig.zip -TimeoutSec 180
          if ((Get-FileHash downloads/zig.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $tool.sha256) { throw 'Zig archive digest differs' }
          if ($null -ne $tool.size -and (Get-Item downloads/zig.zip).Length -ne $tool.size) { throw 'Zig archive size differs' }
          Expand-Archive downloads/zig.zip downloads/zig
          $binary = @(Get-ChildItem downloads/zig -Filter zig.exe -Recurse)
          if ($binary.Count -ne 1) { throw 'Expected exactly one Zig compiler' }
          "BTRC_NATIVE_ZIG=$($binary[0].FullName)" >> $env:GITHUB_ENV
      - name: Run both retained frontend projections on actual Windows hardware
        run: |
          python -B inputs/qualify.py --source compiler --inputs inputs --zig "$env:BTRC_NATIVE_ZIG" --archive downloads/zig.zip --output evidence --arch '${{ matrix.arch }}' --label '${{ matrix.runner }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain native results and unchanged projected sources
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-process-threads-${{ matrix.arch }}
          path: |
            evidence
            inputs
          if-no-files-found: error
          retention-days: 30
