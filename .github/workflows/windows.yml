name: Windows

# Native Windows verification of the self-hosted compiler. Nix doesn't run on
# Windows, so this installs Python + Zig directly and exercises the same compat
# layer the cross-build uses (src/stdlib/win, via -I + -include). We pin
# `-target x86_64-windows-gnu` so zig uses the MinGW-w64 (gnu) ABI with bundled
# winpthreads — identical to `make btrcc-windows-x64`. Without it, zig auto-
# selects the MSVC ABI on the runner, which has no <pthread.h>. The resulting
# MinGW .exe still runs natively on Windows, so this remains a real exec test.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      WIN_COMPAT_HEADER: "src/stdlib/win/btrc_win_compat.h"
      ZIG_TARGET: "x86_64-windows-gnu"
    steps:
      # Pin action implementations by commit so moving tags cannot alter CI.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      # Install zig directly from ziglang.org (no setup action — its mirror 404s
      # for some releases). 0.15.2 matches the project's flake and bundles the
      # winpthreads headers for the windows-gnu target (older zig lacks them).
      - name: Install zig 0.15.2
        shell: pwsh
        run: |
          $ver = "0.15.2"
          $zip = "zig-x86_64-windows-$ver.zip"
          $expectedSha256 = "3a0ed1e8799a2f8ce2a6e6290a9ff22e6906f8227865911fb7ddedc3cc14cb0c"
          Invoke-WebRequest -Uri "https://ziglang.org/download/$ver/$zip" -OutFile zig.zip
          $actualSha256 = (Get-FileHash -Algorithm SHA256 zig.zip).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Zig archive SHA-256 mismatch: expected $expectedSha256, got $actualSha256"
          }
          Expand-Archive -Path zig.zip -DestinationPath zig-install -Force
          Add-Content -Path $env:GITHUB_PATH -Value "$PWD\zig-install\zig-x86_64-windows-$ver"
      - name: zig version
        run: zig version

      - name: Transpile + build btrcc.exe (native Windows)
        run: |
          mkdir -p dist
          python -m src.compiler.python.main src/compiler/btrc/btrcc_main.btrc --no-cache -o dist/btrcc.c
          zig cc -target "$ZIG_TARGET" -std=c11 -O2 -Wall -Wextra -Werror -pedantic -I src/stdlib/win -include "$WIN_COMPAT_HEADER" dist/btrcc.c -o dist/btrcc.exe -lm
          test -f dist/btrcc.exe

      - name: Build + run a sample btrc program (asserts PASS)
        run: |
          python -m src.compiler.python.main src/tests/strings/test_braces_in_code_gen.btrc --no-cache -o dist/win_sample.c
          zig cc -target "$ZIG_TARGET" -std=c11 -O2 -Wall -Wextra -Werror -pedantic -I src/stdlib/win -include "$WIN_COMPAT_HEADER" dist/win_sample.c -o dist/win_sample.exe -lm
          out=$(./dist/win_sample.exe)
          echo "$out"
          echo "$out" | grep -q "^PASS:"

      - name: Prove Windows drive, UNC, and separator semantics
        run: |
          python -m src.compiler.python.main src/tests/stdlib/test_stdlib_path_windows_lexical.btrc --no-cache -o dist/win_paths.c
          zig cc -target "$ZIG_TARGET" -std=c11 -O2 -Wall -Wextra -Werror -pedantic -I src/stdlib/win -include "$WIN_COMPAT_HEADER" dist/win_paths.c -o dist/win_paths.exe -lm
          out=$(./dist/win_paths.exe)
          echo "$out"
          echo "$out" | grep -q "^PASS:"

      - name: btrcc.exe transpiles a program natively (emits C to stdout)
        run: |
          ./dist/btrcc.exe src/tests/strings/test_braces_in_code_gen.btrc > dist/from_btrcc.c
          test -s dist/from_btrcc.c
          echo "btrcc.exe produced $(wc -l < dist/from_btrcc.c) lines of C"
          # the C btrcc emits must itself build + run on native Windows
          zig cc -target "$ZIG_TARGET" -std=c11 -O2 -Wall -Wextra -Werror -pedantic -I src/stdlib/win -include "$WIN_COMPAT_HEADER" dist/from_btrcc.c -o dist/from_btrcc.exe -lm
          out=$(./dist/from_btrcc.exe)
          echo "$out"
          echo "$out" | grep -q "^PASS:"

      - name: btrcc resolves a backslash path containing spaces
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist\path project" | Out-Null
          Set-Content -Encoding utf8NoBOM -Path "dist\path project\lib.btrc" -Value 'string pathMessage() { return "PASS: windows path"; }'
          Set-Content -Encoding utf8NoBOM -Path "dist\path project\main.btrc" -Value @'
          #include "lib.btrc"
          int main() { print(pathMessage()); return 0; }
          '@
          & .\dist\btrcc.exe "dist\path project\main.btrc" | Set-Content -Encoding utf8NoBOM "dist\path project\program.c"
          if ($LASTEXITCODE -ne 0) { throw "btrcc path compilation failed" }
          zig cc -target $env:ZIG_TARGET -std=c11 -O2 -Wall -Wextra -Werror -pedantic -I src/stdlib/win -include $env:WIN_COMPAT_HEADER "dist\path project\program.c" -o "dist\path project\program.exe" -lm
          if ($LASTEXITCODE -ne 0) { throw "generated path program failed to build" }
          $out = & "dist\path project\program.exe"
          if ($LASTEXITCODE -ne 0 -or $out -ne "PASS: windows path") {
            throw "unexpected path program output: $out"
          }
