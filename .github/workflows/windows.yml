name: Windows

# Native Windows verification of the self-hosted compiler. Nix doesn't run on
# Windows, so this installs Python + Zig directly and exercises the same compat
# layer the cross-build uses (src/runtime/windows, via -I + -include). We pin
# `-target x86_64-windows-gnu` so zig uses the MinGW-w64 (gnu) ABI with bundled
# winpthreads — identical to `make btrcc-windows-x64`. Without it, zig auto-
# selects the MSVC ABI on the runner, which has no <pthread.h>. The resulting
# MinGW .exe still runs natively on Windows, so this remains a real exec test.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual dispatch (`gh workflow run`) reruns these hosted jobs without a push:
  # `-f focus=native-gui` runs only the native-GUI job, `-f focus=extended`
  # the extended tier.
  workflow_dispatch:
    inputs:
      focus:
        description: Which jobs to run
        type: choice
        options: [full, native-gui, extended]
        default: full
  # release.yml calls this workflow with the tier it runs.
  workflow_call:
    inputs:
      tier:
        description: The ci/tiers.toml tier to run
        type: string
        required: true

permissions:
  contents: read

# The scope job plans this file's jobs from ci/tiers.toml under this name.
env:
  CI_WORKFLOW: windows.yml

# A newer push to a pull request cancels the run it supersedes. Runs on main
# never cancel one another: GitHub keeps one running and one pending run per
# group, so a newer main push replaces an older one still waiting. A manual
# dispatch, and each call from release.yml, gets a group of its own. The
# literal prefix keeps the three workflows release.yml calls apart: a called
# workflow's github.workflow is its caller's.
concurrency:
  group: windows-${{ inputs.tier && format('call-{0}', github.run_id) || github.event_name == 'pull_request' && format('pr-{0}', github.head_ref) || github.event_name == 'push' && 'main' || format('dispatch-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Classifies the event into one tier, then reads ci/tiers.toml for the jobs
  # and matrix rows that tier runs in this workflow (CI_WORKFLOW). ci.yml,
  # macos.yml and windows.yml carry identical copies; ci/tiers.toml describes
  # each tier and lists every job.
  #   release, extended  release.yml's call (its tier input), or a dispatch
  #         with focus=extended.
  #   native-gui  a dispatch with focus=native-gui.
  #   main  a push, a full dispatch, the ci:full label (added before a push or
  #         a rerun), a change under FULL_PATHS (the compilers, their specs and
  #         runtime, the stdlib modules btrcc imports, the CI hotspots), or a
  #         pull request too large to list.
  #   docs  Markdown that no test or tool reads.
  #   lane  any other change on a codex/* branch.
  #   pr    any other pull request; its changed paths select its shards.
  # Labels and files are read through the API rather than the event payload,
  # so "Re-run all jobs" sees a label added after the push ("Re-run failed
  # jobs" keeps this job's earlier result).
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tier: ${{ steps.classify.outputs.tier }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Classify the change
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TIER: ${{ inputs.tier }}
          FOCUS: ${{ inputs.focus }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          FULL_PATHS: '^(src/(compiler|language|runtime)/|tools/compiler_codegen/|src/stdlib/[A-Za-z0-9]+\.btrc$|src/stdlib/(BackgroundJobs|Digest|FileSystem)/|\.github/workflows/(ci|macos|windows|release)\.yml$|ci/tiers\.toml$|Makefile$|flake\.(nix|lock)$|nix/|src/tests/(conftest|runner_capabilities)\.py$|tools/(native_plan|budget_bench)\.py$)'
          TEST_READ_MARKDOWN: '^(PLAN|AGENTS|CLAUDE)\.md$|(^|/)README\.md$|^docs/design/(native-ui-parity|platform-parity|native-ui-api-inventory|compiler-structure|btrsmith-rename-table-w2|plan-reference|platform-toolchain-matrix)\.md$'
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          mkdir -p build
          : > build/changed-files.txt
          classify() {
            if [ -n "$TIER" ]; then
              echo "$TIER"
              return
            elif [ "$EVENT" = workflow_dispatch ]; then
              case "${FOCUS:-full}" in
                full) echo main ;;
                *) echo "$FOCUS" ;;
              esac
              return
            elif [ "$EVENT" != pull_request ]; then
              echo main
              return
            fi
            pull=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST")
            if jq -e 'any(.labels[]; .name == "ci:full")' <<<"$pull" >/dev/null; then
              echo main
              return
            fi
            pages=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST/files?per_page=100")
            # The files endpoint lists at most 3,000 files; an unlisted one could be anything.
            if [ "$(jq 'map(length) | add // 0' <<<"$pages")" -ne "$(jq '.changed_files' <<<"$pull")" ]; then
              echo main
              return
            fi
            # A rename counts at both paths.
            names=$(jq -r '.[][] | .filename, (.previous_filename // empty)' <<<"$pages")
            printf '%s\n' "$names" > build/changed-files.txt
            if grep -Eq "$FULL_PATHS" <<<"$names"; then
              echo main
            elif ! grep -Evq '\.md$' <<<"$names" && ! grep -Eq "$TEST_READ_MARKDOWN" <<<"$names"; then
              echo docs
            elif [[ "$HEAD_REF" == codex/* ]]; then
              echo lane
            else
              echo pr
            fi
          }
          tier=$(classify)
          case "$tier" in
            docs | pr | lane | main | extended | release | native-gui) ;;
            *) echo "::error::unknown tier: $tier"; exit 1 ;;
          esac
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "Tier: \`$tier\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Plan the tier's jobs
        id: plan
        env:
          TIER: ${{ steps.classify.outputs.tier }}
        run: |
          set -euo pipefail
          plan=$(python3 -m tools.qualification tiers --workflow "$CI_WORKFLOW" --tier "$TIER" --changed build/changed-files.txt)
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          jq -r '"Jobs: " + (.jobs | join(", ")), (.matrix | to_entries[] | "\(.key): \(.value.include | length) row(s)")' <<<"$plan" >> "$GITHUB_STEP_SUMMARY"

  windows:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.plan).jobs, 'windows')
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      WIN_COMPAT_HEADER: "src/runtime/windows/btrc_win_compat.h"
      ZIG_TARGET: "x86_64-windows-gnu"
    steps:
      # Pin action implementations by commit so moving tags cannot alter CI.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: src/devex/vscode/package-lock.json

      - name: Exercise native extension cleanup and package the real VSIX
        run: |
          python -m pip install '.[dev]'
          node src/devex/vscode/packaging/prepare.js
          cd build/devex/vscode
          npm ci
          npm test
          npm run package
          cd ../../..
          python - <<'PY'
          from zipfile import ZipFile

          required = {
              "extension/out/extension.js",
              "extension/server/src/devex/lsp/__main__.py",
              "extension/server/src/devex/debug/__main__.py",
              "extension/server/vendor/pygls/__init__.py",
          }
          with ZipFile("dist/btrc.vsix") as archive:
              names = set(archive.namelist())
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"packaged VSIX is missing: {missing}")
          PY

      # Each pytest step writes its own skip report and gates it against
      # src/tests/fixtures/expected-skips/windows.json, so an unexpected skip
      # fails the step; "Retain the skip report" still uploads every report.
      - name: Prove native artifact storage portability
        run: |
          python -m pytest -q \
            src/tests/python/test_artifact_storage.py \
            src/tests/python/test_artifact_reparse.py \
            src/tests/python/test_btrcc_bundle_publication.py::test_generation_validator_uses_host_staging_mode_contract \
            src/tests/python/test_btrcc_bundle_publication.py::test_generation_validator_matches_native_windows_staging_modes \
            --skip-report=build/skip-report-windows-artifacts.json
          python -m tools.qualification skip-gate build/skip-report-windows-artifacts.json

      # Install zig directly from ziglang.org (no setup action — its mirror 404s
      # for some releases). 0.16.0 matches the project's flake and bundles the
      # winpthreads headers for the windows-gnu target (older zig lacks them).
      - name: Install zig 0.16.0
        shell: pwsh
        run: |
          $ver = "0.16.0"
          $zip = "zig-x86_64-windows-$ver.zip"
          $expectedSha256 = "68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e"
          Invoke-WebRequest -Uri "https://ziglang.org/download/$ver/$zip" -OutFile zig.zip
          $actualSha256 = (Get-FileHash -Algorithm SHA256 zig.zip).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Zig archive SHA-256 mismatch: expected $expectedSha256, got $actualSha256"
          }
          Expand-Archive -Path zig.zip -DestinationPath zig-install -Force
          Add-Content -Path $env:GITHUB_PATH -Value "$PWD\zig-install\zig-x86_64-windows-$ver"
      - name: zig version
        run: zig version

      - name: Verify native Windows compatibility seams
        run: |
          python -m pytest -q src/tests/python/test_native_win_compat.py --skip-report=build/skip-report-windows-compat.json
          python -m tools.qualification skip-gate build/skip-report-windows-compat.json

      - name: Transpile + build relocatable btrcc bundle (native Windows)
        run: |
          python -m tools.compiler_codegen.main check
          mkdir -p dist build/btrcc/windows-x64
          # The compiler's own sources must analyze without a warning.
          python -m src.compiler.python.main src/compiler/btrc/cli/WindowsMain.btrc --no-cache -o dist/btrcc-windows.c 2> build/btrcc-windows.stderr || { cat build/btrcc-windows.stderr; exit 1; }
          cat build/btrcc-windows.stderr
          if grep -q "^warning:" build/btrcc-windows.stderr; then
            echo "::error::the Windows self-host transpile emitted $(grep -c '^warning:' build/btrcc-windows.stderr) analyzer warnings"
            exit 1
          fi
          zig cc -target "$ZIG_TARGET" -std=c11 -O2 -Wall -Wextra -Werror -pedantic -I src/runtime/windows -include "$WIN_COMPAT_HEADER" dist/btrcc-windows.c -o build/btrcc/windows-x64/btrcc.exe -lm
          python -m src.compiler.python.main bundle --binary build/btrcc/windows-x64/btrcc.exe --target windows-x64 --output-dir dist --source-root .
          test -f dist/btrcc-windows-x64/bin/btrcc.exe
          test -f dist/btrcc-windows-x64.zip
          test -f dist/btrcc-windows-x64.zip.sha256

      - name: Build and run a sample btrc program against its exact golden
        run: |
          python -m src.compiler.python.main src/tests/strings/BracesInCodeGen.btrc --no-cache -o dist/win_sample.c
          zig cc -target "$ZIG_TARGET" -std=c11 -O2 -Wall -Wextra -Werror -pedantic -I src/runtime/windows -include "$WIN_COMPAT_HEADER" dist/win_sample.c -o dist/win_sample.exe -lm
          ./dist/win_sample.exe > dist/win_sample.stdout
          python - <<'PY'
          from pathlib import Path

          def logical_lines(path: str) -> list[str]:
              return Path(path).read_text(encoding="utf-8").splitlines()

          actual = logical_lines("dist/win_sample.stdout")
          expected = logical_lines("src/tests/strings/expected/BracesInCodeGen.stdout")
          if actual != expected:
              raise SystemExit(f"sample output mismatch: {actual!r} != {expected!r}")
          PY

      - name: Prove Windows drive, UNC, and separator semantics
        run: |
          python -m src.compiler.python.main src/tests/stdlib/PathWindowsLexical.btrc --no-cache -o dist/win_paths.c
          zig cc -target "$ZIG_TARGET" -std=c11 -O2 -Wall -Wextra -Werror -pedantic -I src/runtime/windows -include "$WIN_COMPAT_HEADER" dist/win_paths.c -o dist/win_paths.exe -lm
          ./dist/win_paths.exe > dist/win_paths.stdout
          python - <<'PY'
          from pathlib import Path

          def logical_lines(path: str) -> list[str]:
              return Path(path).read_text(encoding="utf-8").splitlines()

          actual = logical_lines("dist/win_paths.stdout")
          expected = logical_lines(
              "src/tests/stdlib/expected/PathWindowsLexical.stdout"
          )
          if actual != expected:
              raise SystemExit(f"path output mismatch: {actual!r} != {expected!r}")
          PY

      - name: Prove dynamic native realpath compatibility
        run: |
          zig cc -target "$ZIG_TARGET" -std=c11 -Wall -Wextra -Werror -pedantic -I src/runtime/windows -include "$WIN_COMPAT_HEADER" src/tests/native/win_compat_main.c src/tests/native/win_compat_helper.c src/tests/native/win_compat_windows_header.c -o dist/win_compat.exe
          ./dist/win_compat.exe
          zig cc -target "$ZIG_TARGET" -std=c11 -Wall -Wextra -Werror -pedantic \
            -DBTRC_WIN_GET_LAST_ERROR=btrc_test_get_last_error \
            -DBTRC_WIN_GET_FILE_ATTRIBUTES=btrc_test_get_file_attributes \
            -DBTRC_WIN_REMOVE_DIRECTORY=btrc_test_remove_directory \
            -I src/runtime/windows -include "$WIN_COMPAT_HEADER" \
            src/tests/native/win_compat_error_seam.c -o dist/win_compat_error_seam.exe
          ./dist/win_compat_error_seam.exe

      - name: Extracted btrcc ZIP transpiles from an unrelated directory
        run: |
          unset BTRC_HOME
          archive="$PWD/dist/btrcc-windows-x64.zip"
          python - <<'PY'
          import hashlib
          from pathlib import Path

          archive = Path("dist/btrcc-windows-x64.zip")
          with archive.open("rb") as stream:
              digest = hashlib.file_digest(stream, "sha256").hexdigest()
          actual = Path(f"{archive}.sha256").read_text(encoding="ascii")
          expected = f"{digest}  {archive.name}\n"
          if actual != expected:
              raise SystemExit(f"archive checksum mismatch: {actual!r} != {expected!r}")
          PY
          extract="$(cygpath -u "$RUNNER_TEMP")/btrcc-windows-smoke"
          rm -rf "$extract"
          mkdir -p "$extract"
          python -m zipfile -e "$archive" "$extract"
          bundle="$extract/btrcc-windows-x64"
          compiler="$bundle/bin/btrcc.exe"
          source="$PWD/src/tests/strings/BracesInCodeGen.btrc"
          run="$extract/unrelated-cwd"
          mkdir "$run"
          python - "$compiler" "$bundle/share/btrc/stdlib" "$run" <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          completed = subprocess.run(
              [sys.argv[1], "--stdlib-dir"],
              cwd=sys.argv[3],
              check=True,
              capture_output=True,
              text=True,
          )
          actual_stdlib = completed.stdout.splitlines()
          expected_stdlib = [str(Path(sys.argv[2]).resolve())]
          if actual_stdlib != expected_stdlib:
              raise SystemExit(
                  f"stdlib path mismatch: {actual_stdlib!r} != {expected_stdlib!r}"
              )
          PY
          (cd "$run" && "$compiler" "$source") > dist/from_btrcc.c
          test -s dist/from_btrcc.c
          echo "btrcc.exe produced $(wc -l < dist/from_btrcc.c) lines of C"
          # the C btrcc emits must itself build + run on native Windows
          zig cc -target "$ZIG_TARGET" -std=c11 -O2 -Wall -Wextra -Werror -pedantic -I src/runtime/windows -include "$WIN_COMPAT_HEADER" dist/from_btrcc.c -o dist/from_btrcc.exe -lm
          ./dist/from_btrcc.exe > dist/from_btrcc.stdout
          python - <<'PY'
          from pathlib import Path

          def logical_lines(path: str) -> list[str]:
              return Path(path).read_text(encoding="utf-8").splitlines()

          actual = logical_lines("dist/from_btrcc.stdout")
          expected = logical_lines("src/tests/strings/expected/BracesInCodeGen.stdout")
          if actual != expected:
              raise SystemExit(f"bundled output mismatch: {actual!r} != {expected!r}")
          PY

      - name: Bundled btrcc follows its final junction target
        shell: pwsh
        run: |
          $target = (Resolve-Path "$env:RUNNER_TEMP\btrcc-windows-smoke\btrcc-windows-x64").Path
          New-Item -ItemType Junction -Path ".\dist\btrcc-junction" -Target $target | Out-Null
          $stdlib = & ".\dist\btrcc-junction\bin\btrcc.exe" --stdlib-dir
          if ($LASTEXITCODE -ne 0) { throw "junction compiler invocation failed" }
          $expected = (Resolve-Path "$target\share\btrc\stdlib").Path
          if ($stdlib -ne $expected) {
            throw "junction resolved to '$stdlib', expected final target '$expected'"
          }

      - name: btrcc resolves a backslash path containing spaces
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist\path project" | Out-Null
          Set-Content -Encoding utf8NoBOM -Path "dist\path project\lib.btrc" -Value 'string pathMessage() { return "PASS: windows path"; }'
          Set-Content -Encoding utf8NoBOM -Path "dist\path project\Main.btrc" -Value @'
          #include "lib.btrc"
          int main() { print(pathMessage()); return 0; }
          '@
          $compiler = (Resolve-Path "$env:RUNNER_TEMP\btrcc-windows-smoke\btrcc-windows-x64\bin\btrcc.exe").Path
          & $compiler "dist\path project\Main.btrc" | Set-Content -Encoding utf8NoBOM "dist\path project\program.c"
          if ($LASTEXITCODE -ne 0) { throw "btrcc path compilation failed" }
          zig cc -target $env:ZIG_TARGET -std=c11 -O2 -Wall -Wextra -Werror -pedantic -I src/runtime/windows -include $env:WIN_COMPAT_HEADER "dist\path project\program.c" -o "dist\path project\program.exe" -lm
          if ($LASTEXITCODE -ne 0) { throw "generated path program failed to build" }
          $out = & "dist\path project\program.exe"
          if ($LASTEXITCODE -ne 0 -or $out -ne "PASS: windows path") {
            throw "unexpected path program output: $out"
          }

      - name: Retain the Windows x64 release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: btrcc-windows-x64
          path: |
            dist/btrcc-windows-x64.zip
            dist/btrcc-windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # Every pytest session classifies its skips in build/skip-report*.json.
      # Keep the report even from a failed run, so a red run's coverage is as
      # visible as a green one's.
      - name: Retain the skip report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skip-report-windows-windows
          path: build/skip-report*.json
          if-no-files-found: warn
          retention-days: 14

  # The native three-stage fixed point, in its own job: it takes most of two
  # hours, so ci/tiers.toml runs it in the main tier and above, while the
  # windows job runs on a pull request whose Windows paths change.
  bootstrap:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.plan).jobs, 'bootstrap')
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      # Pin action implementations by commit so moving tags cannot alter CI.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install the test dependencies
        run: python -m pip install '.[dev]'

      # Install zig directly from ziglang.org (no setup action — its mirror 404s
      # for some releases). 0.16.0 matches the project's flake and bundles the
      # winpthreads headers for the windows-gnu target (older zig lacks them).
      - name: Install zig 0.16.0
        shell: pwsh
        run: |
          $ver = "0.16.0"
          $zip = "zig-x86_64-windows-$ver.zip"
          $expectedSha256 = "68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e"
          Invoke-WebRequest -Uri "https://ziglang.org/download/$ver/$zip" -OutFile zig.zip
          $actualSha256 = (Get-FileHash -Algorithm SHA256 zig.zip).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Zig archive SHA-256 mismatch: expected $expectedSha256, got $actualSha256"
          }
          Expand-Archive -Path zig.zip -DestinationPath zig-install -Force
          Add-Content -Path $env:GITHUB_PATH -Value "$PWD\zig-install\zig-x86_64-windows-$ver"
      - name: Prove native three-stage bootstrap fixed point
        timeout-minutes: 150
        env:
          BTRC_CC: "zig cc -target x86_64-windows-gnu"
          BTRC_CFLAGS: "-std=c11 -O2 -Wall -Wextra -Werror -pedantic -I src/runtime/windows -include src/runtime/windows/btrc_win_compat.h"
          # Windows hosted runners need more than 20 minutes for one selfhost
          # transpile of the compiler. Keep each stage bounded independently.
          BTRC_BOOTSTRAP_TIMEOUT_SECONDS: "3600"
        run: |
          python -m pytest -q src/tests/btrc/test_bootstrap_harness.py --skip-report=build/skip-report-windows-bootstrap-harness.json
          python -m tools.qualification skip-gate build/skip-report-windows-bootstrap-harness.json
          # Run from the repository root so the test's src.tests imports resolve;
          # the installed package carries src.compiler but not src.tests.
          python -m unittest -v src.tests.btrc.test_bootstrap

      # Every pytest session classifies its skips in build/skip-report*.json.
      # Keep the report even from a failed run, so a red run's coverage is as
      # visible as a green one's.
      - name: Retain the skip report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skip-report-windows-bootstrap
          path: build/skip-report*.json
          if-no-files-found: warn
          retention-days: 14
