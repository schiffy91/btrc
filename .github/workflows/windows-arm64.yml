name: Windows ARM64 Toolchain

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-arm64.yml
      - tools/windows_toolchain/**
      - tools/target_hosts/windows/**
      - src/compiler/**
      - src/language/**
      - src/runtime/**
      - src/stdlib/**
      - src/tests/btrc/test_bootstrap.py
      - src/tests/python/test_ci_workflow_contracts.py
      - flake.nix
      - flake.lock
      - nix/wgpu-native-prebuilt.nix
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/windows-arm64.yml
      - tools/windows_toolchain/**
      - tools/target_hosts/windows/**
      - src/compiler/**
      - src/language/**
      - src/runtime/**
      - src/stdlib/**
      - src/tests/btrc/test_bootstrap.py
      - src/tests/python/test_ci_workflow_contracts.py
      - flake.nix
      - flake.lock
      - nix/wgpu-native-prebuilt.nix
  workflow_dispatch:
    inputs:
      focus:
        description: Qualification to run
        type: choice
        options: [full, bootstrap-io, daemon-runtime, daemon-corpus, daemon-posix]
        default: full

permissions:
  contents: read

concurrency:
  group: windows-arm64-${{ github.event_name == 'pull_request' && format('pr-{0}', github.head_ref) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cross:
    if: github.event_name != 'workflow_dispatch' || inputs.focus == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@c70cb8ae92d68c66953db28a26a63db1665bc837 # v3.21.5
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false
      - name: Check portable evidence tooling
        run: nix develop --command python3 -m unittest tools.windows_toolchain.test_arm64 -v
      - name: Cross-build the ARM64 compiler
        run: nix develop --command python3 -m tools.windows_toolchain.arm64 cross --out build/windows-arm64-cross
      - name: Retain cross evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-arm64-cross
          path: build/windows-arm64-cross
          if-no-files-found: warn
          retention-days: 30

  native:
    needs: cross
    runs-on: windows-11-arm
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          architecture: arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-arm64-cross
          path: build/windows-arm64-input
      - name: Install verified toolchain archives
        run: |
          $ErrorActionPreference = 'Stop'
          $pins = Get-Content tools/windows_toolchain/pins.json -Raw | ConvertFrom-Json
          New-Item -ItemType Directory -Force downloads | Out-Null
          $zig = 'downloads/zig.zip'
          Invoke-WebRequest $pins.zig_windows_arm64.tarball -OutFile $zig
          if ((Get-Item $zig).Length -ne [long]$pins.zig_windows_arm64.size -or
              (Get-FileHash $zig -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pins.zig_windows_arm64.shasum) {
            throw 'Pinned Zig archive size/hash mismatch'
          }
          Expand-Archive $zig downloads/zig -Force
          $binary = @(Get-ChildItem downloads/zig -Filter zig.exe -Recurse)
          if ($binary.Count -ne 1) { throw 'Expected exactly one Zig executable' }
          $binary[0].DirectoryName >> $env:GITHUB_PATH
          Invoke-WebRequest $pins.wgpu.url -OutFile downloads/wgpu.zip
          if ((Get-FileHash downloads/wgpu.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pins.wgpu.sha256) {
            throw 'Pinned wgpu archive hash mismatch'
          }
          python -m pip install '.[dev]'
      - name: Verify native process ownership and probe tooling
        run: |
          python -m unittest tools.windows_toolchain.test_arm64 -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/windows_toolchain/test_probe.ps1
      - name: Qualify native compiler and bootstrap
        timeout-minutes: 210
        run: python -m tools.windows_toolchain.arm64 native --cross build/windows-arm64-input/btrcc.exe --cross-summary build/windows-arm64-input/summary.json --out build/windows-arm64-native
      - name: Qualify MSVC ABI and wgpu
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: ./tools/windows_toolchain/msvc_probe.ps1 -WgpuArchive downloads/wgpu.zip -OutputDirectory build/windows-arm64-msvc
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-arm64-native
          path: |
            build/windows-arm64-native
            build/windows-arm64-msvc
          if-no-files-found: warn
          retention-days: 30

  daemon-build:
    if: github.event_name == 'workflow_dispatch' && (inputs.focus == 'daemon-corpus' || inputs.focus == 'daemon-posix')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BTRC_TEST_RUNNER: linux-hosted
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@c70cb8ae92d68c66953db28a26a63db1665bc837 # v3.21.5
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false
      - name: Build one compiler with the Unix SDK reader and source receipts
        run: |
          nix develop --command python -m tools.compiler_build transpile --entry src/compiler/btrc/BtrccMain.btrc --target linux-x86_64 --output build/windows-daemon/btrcc.c
          nix develop --command python -m tools.compiler_build compile --input build/windows-daemon/btrcc.c --output build/windows-daemon/btrcc -- clang -std=c11 -pedantic-errors -Wall -Wextra -Werror -O0 '{input}' -o '{output}' -lm -lpthread
      - name: Execute portable and POSIX Daemon cases with the same compiler on Linux
        run: |
          nix develop --command env BTRC_TEST_BTRCC="$PWD/build/windows-daemon/btrcc" python -m pytest -q src/tests/runner.py -k Daemon --compilers both --junitxml=build/windows-daemon/linux/corpus.xml --skip-report=build/skip-report-daemon-linux.json
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('build/windows-daemon/linux/corpus.xml').findall('.//testcase')
          assert len(cases) == 6, len(cases)
          assert all(case.find(tag) is None for case in cases for tag in ('failure', 'error', 'skipped'))
          PY
      - name: Build the Daemon corpus through both compilers for both Windows architectures
        if: inputs.focus == 'daemon-corpus'
        run: |
          for label in windows-x86_64 windows-aarch64; do
            nix develop --command python -m src.tests.target_runner --target "$label" --frontend both --btrcc build/windows-daemon/btrcc --compile-only --program stdlib/Daemon.btrc --program stdlib/DaemonToken.btrc --output "build/windows-daemon/$label"
          done
      - name: Retain Linux portable and POSIX corpus evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daemon-corpus-linux
          path: |
            build/windows-daemon/linux
            build/windows-daemon/*.compiler-build
          retention-days: 30
      - name: Retain x64 corpus and compiler provenance
        if: ${{ always() && inputs.focus == 'daemon-corpus' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daemon-corpus-windows-x86_64
          path: |
            build/windows-daemon/windows-x86_64
            build/windows-daemon/*.compiler-build
          retention-days: 30
      - name: Retain ARM64 corpus and compiler provenance
        if: ${{ always() && inputs.focus == 'daemon-corpus' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daemon-corpus-windows-aarch64
          path: |
            build/windows-daemon/windows-aarch64
            build/windows-daemon/*.compiler-build
          retention-days: 30
      - name: Retain the skip report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skip-report-windows-arm64-daemon-build
          path: build/skip-report*.json
          if-no-files-found: warn
          retention-days: 14

  daemon-runtime:
    needs: daemon-build
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (inputs.focus == 'bootstrap-io' || inputs.focus == 'daemon-runtime' || (inputs.focus == 'daemon-corpus' && needs.daemon-build.result == 'success')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            architecture: X64
            target: x86_64-windows-gnu
            python: x64
            label: windows-x86_64
          - runner: windows-11-arm
            architecture: Arm64
            target: aarch64-windows-gnu
            python: arm64
            label: windows-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install the pinned native Zig toolchain
        if: ${{ inputs.focus != 'daemon-corpus' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString() -ne '${{ matrix.architecture }}') {
            throw 'The qualification process is not running on the requested native architecture'
          }
          if ('${{ matrix.architecture }}' -eq 'Arm64') {
            $pins = Get-Content tools/windows_toolchain/pins.json -Raw | ConvertFrom-Json
            $url = $pins.zig_windows_arm64.tarball
            $digest = $pins.zig_windows_arm64.shasum
          } else {
            $url = 'https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip'
            $digest = '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e'
          }
          Invoke-WebRequest $url -OutFile zig.zip
          if ((Get-FileHash zig.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $digest) {
            throw 'Pinned Zig archive hash mismatch'
          }
          Expand-Archive zig.zip zig-install -Force
          $binary = @(Get-ChildItem zig-install -Filter zig.exe -Recurse)
          if ($binary.Count -ne 1) { throw 'Expected exactly one Zig executable' }
          $binary[0].DirectoryName >> $env:GITHUB_PATH
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python }}
      - name: Install runtime-test dependencies
        run: python -m pip install '.[dev]'
      - name: Record native toolchain and runner provenance
        run: |
          $ErrorActionPreference = 'Stop'
          if ([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString() -ne '${{ matrix.architecture }}') {
            throw 'The qualification process is not running on the requested native architecture'
          }
          New-Item -ItemType Directory -Force build/windows-runtime | Out-Null
          $version = 'compiled by the Linux bundle producer'
          if ('${{ inputs.focus }}' -ne 'daemon-corpus') {
            $version = zig version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          @{
            revision = '${{ github.sha }}'
            target = '${{ matrix.target }}'
            process_architecture = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
            os_architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
            zig_version = $version
          } | ConvertTo-Json | Set-Content build/windows-runtime/provenance.json
      - name: Build and execute the native process and bootstrap harness
        if: ${{ inputs.focus != 'daemon-corpus' }}
        run: |
          $ErrorActionPreference = 'Stop'
          zig cc -target '${{ matrix.target }}' -std=c11 -pedantic-errors -Wall -Wextra -Werror -O2 -I src/runtime/c src/tests/native/windows_launch/launch_harness.c src/runtime/c/windows_os.c -lshell32 -ladvapi32 -o build/windows-runtime/harness.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $arguments = @()
          $success = '^windows-launch-seam PASS checks=[1-9][0-9]*$'
          if ('${{ inputs.focus }}' -eq 'bootstrap-io') {
            $arguments = @('--bootstrap-io')
            $success = '^windows-bootstrap-io PASS checks=[1-9][0-9]*$'
          }
          $output = & ./build/windows-runtime/harness.exe @arguments 2>&1
          $status = $LASTEXITCODE
          $output | Tee-Object build/windows-runtime/result.log
          if ($status -ne 0) { exit $status }
          if (($output | Select-Object -Last 1) -notmatch $success) {
            throw 'Missing native harness success report'
          }
      - name: Verify native companion images and transfer failure paths
        if: ${{ !cancelled() && inputs.focus == 'daemon-runtime' }}
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pytest -q -rA src/tests/python/test_windows_daemon_image.py src/tests/python/test_windows_daemon_transfer.py -k '${{ matrix.label }} and native' --basetemp=build/windows-runtime/pytest --junitxml=build/windows-runtime/daemon.xml --skip-report=build/skip-report-windows-daemon-${{ matrix.label }}.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import xml.etree.ElementTree as E; r=E.parse('build/windows-runtime/daemon.xml').getroot(); t=list(r.iter('testcase')); assert len(t)==7 and not any(c.find(x) is not None for c in t for x in ('skipped','failure','error')), 'Native Daemon qualification requires all seven cases to pass'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native compiler file identity and unchanged output reuse
        if: ${{ inputs.focus == 'daemon-corpus' }}
        run: |
          python -m pytest -q src/tests/python/test_compiler_build_identity.py src/tests/python/test_source_io.py -k 'compiler_digest or owned_unchanged_generation' --junitxml=build/windows-runtime/compiler-identity.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.focus == 'daemon-corpus' }}
        with:
          name: daemon-corpus-${{ matrix.label }}
          path: build/windows-runtime/input
      - name: Execute the portable Daemon corpus through both compilers
        if: ${{ inputs.focus == 'daemon-corpus' }}
        run: |
          $ErrorActionPreference = 'Stop'
          python -m src.tests.target_runner --execute-bundle 'build/windows-runtime/input/${{ matrix.label }}/bundle' --frontend both --executor windows-native --output build/windows-runtime/corpus
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import json; r=json.load(open('build/windows-runtime/corpus/target-run.json')); assert set(r['frontends']) == {'reference', 'selfhost'} and len(r['results']) == 4 and all(x['status'] == 'passed' for x in r['results']), 'Both compilers must pass both native Daemon programs'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain native runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daemon-runtime-${{ matrix.architecture }}
          path: build/windows-runtime
          if-no-files-found: warn
          retention-days: 30
      - name: Retain the skip report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skip-report-windows-arm64-daemon-runtime-${{ matrix.label }}
          path: build/skip-report*.json
          if-no-files-found: warn
          retention-days: 30
