name: Qualify first-party crypto
on:
  pull_request:
    branches: [claude/exciting-cori-xcqe5y-crypto]
permissions:
  contents: read
  actions: read
jobs:
  apple:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ios-aarch64-simulator
            runner: xcode-27
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    env:
      BTRC_TEST_RUNNER: macos-hosted
      QUALIFY_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: d4bfc5c4d35ca0f1660dd1969ee8cada39744e4b
      - uses: DeterminateSystems/determinate-nix-action@c70cb8ae92d68c66953db28a26a63db1665bc837
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d
        with:
          use-flakehub: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: btrcc-macos-arm64
          run-id: 45289410508
          github-token: ${{ github.token }}
          path: build/host-compiler
      - name: Check the published compiler and qualify iOS binaries
        shell: bash
        run: |
          (cd build/host-compiler && shasum -a 256 -c btrcc-macos-arm64.tar.gz.sha256 && tar -xzf btrcc-macos-arm64.tar.gz)
          nix develop --command bash -euo pipefail <<'CHECK'
          export BTRC_HOME="$PWD/src" BTRC_TEST_BTRCC="$PWD/build/host-compiler/btrcc-macos-arm64/bin/btrcc"
          export BTRC_IOS_UI_DEVICES=ipad
          python -m src.tests.target_runner --target "$QUALIFY_TARGET" --frontend both --btrcc "$BTRC_TEST_BTRCC" --program 'stdlib/Crypto*.btrc' --compile-only --output build/crypto --jobs 2
          binaries=(build/crypto/bundle/*-stdlib-Crypto*)
          test "${#binaries[@]}" -eq 4
          python -m tools.qualification.dependencies binary --target "$QUALIFY_TARGET" "${binaries[@]}"
          python -m pytest --compilers=both -vv -s --durations=0 --basetemp="$RUNNER_TEMP/crypto-ios-tests" 'src/tests/python/test_stdlib_ios_programs.py::test_ios_stdlib_program[ipad-crypto-selfhost-plain]' --junitxml=build/crypto-ios.xml
          python -c 'import xml.etree.ElementTree as E; cases=E.parse("build/crypto-ios.xml").findall(".//testcase"); assert len(cases)==1 and cases[0].find("skipped") is None'
          programs=("$RUNNER_TEMP"/crypto-ios-tests/*/crypto-selfhost-plain/Program)
          test -f "${programs[0]}"
          python -m tools.qualification.dependencies binary --target "$QUALIFY_TARGET" "${programs[@]}"
          CHECK
