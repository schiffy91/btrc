name: macOS warnings (temporary)

on:
  push:
    branches: [stage4/macos-nullable-warnings]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warnings:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: DeterminateSystems/determinate-nix-action@c70cb8ae92d68c66953db28a26a63db1665bc837 # v3.21.5
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false
      - name: Build the native header reader
        run: nix build .#btrc-native-header --no-link --print-build-logs
      - name: Transpile examples and MacOS modules
        run: |
          nix develop --command bash -c '
            mkdir -p build
            for f in examples/*/*.btrc; do
              echo "=== $f"
              python3 -m src.compiler.python.main "$f" --no-cache -o /tmp/x.c 2>&1 | grep -A3 "warning" || true
            done
            {
              for f in $(find src/stdlib -path "*MacOS*" -name "*.btrc"); do
                m=${f#src/stdlib/}; m=${m%.btrc}; echo "import Library.${m//\//.};"
              done
              echo "int main() { return 0; }"
            } > /tmp/AllMacOS.btrc
            cat /tmp/AllMacOS.btrc
            python3 -m src.compiler.python.main /tmp/AllMacOS.btrc --no-cache -o /tmp/y.c 2>&1 | grep -A3 "warning" || true
          '
      - name: Run the native and example tests while recording warnings
        run: |
          nix develop --command bash -c '
            python3 -m pytest -p tools.tmp_located_warnings -n 3 -q --tb=line -p no:cacheprovider \
              src/tests/python/test_examples.py src/tests/python/test_native_control_sizing_runtime.py \
              src/tests/python/test_native_gui_appkit.py src/tests/python/test_native_pointer_runtime.py \
              src/tests/python/test_native_webgpu_imports.py src/tests/python/test_native_font_runtime.py \
              src/tests/python/test_native_tray_runtime.py src/tests/python/test_native_gui_runtime.py \
              src/tests/python/test_native_image_graphics.py \
              src/tests/python/test_macos_encoded_image_decoder_runtime.py || true
            echo "===== LOCATED WARNINGS ====="
            sort build/located-warnings.txt | uniq -c || true
          '
