name: Host Android

# A throwaway dispatch for CX-P1-09 (never merged): can a hosted arm64 Linux
# runner start an arm64 Android emulator, that is, does it expose KVM?
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64-kvm-probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Look for KVM
        run: |
          uname -a
          ls -l /dev/kvm || echo "no /dev/kvm"
          grep -c processor /proc/cpuinfo || true
          grep -m1 -i -E 'features|flags' /proc/cpuinfo || true
          lsmod | grep -i kvm || echo "no kvm module listed"
          test -e /dev/kvm && echo "KVM: present" || echo "KVM: absent"
          ls "$ANDROID_SDK_ROOT" 2>/dev/null || echo "no Android SDK on this image"
