name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual dispatch (`gh workflow run`) reruns these hosted jobs without a push:
  # `-f focus=native-gui` runs only the native-GUI job and the Linux GUI shard,
  # `-f focus=extended` the extended tier.
  workflow_dispatch:
    inputs:
      focus:
        description: Which jobs to run
        type: choice
        options: [full, native-gui, extended]
        default: full
  # release.yml calls this workflow with the tier it runs.
  workflow_call:
    inputs:
      tier:
        description: The ci/tiers.toml tier to run
        type: string
        required: true

# There is no binary-cache account (PLAN.md D26), so every magic-nix-cache
# step sets use-flakehub: false and uses the GitHub Actions cache alone. At
# its default the action tries FlakeHub first, and the failed login was the
# first error in every Nix job's log. No step needs an OIDC token.
permissions:
  contents: read

# The scope job plans this file's jobs from ci/tiers.toml under this name.
env:
  CI_WORKFLOW: ci.yml

# A newer push to a pull request cancels the run it supersedes. Runs on main
# never cancel one another: GitHub keeps one running and one pending run per
# group, so a newer main push replaces an older one still waiting. A manual
# dispatch, and each call from release.yml, gets a group of its own. The
# literal prefix keeps the three workflows release.yml calls apart: a called
# workflow's github.workflow is its caller's.
concurrency:
  group: ci-${{ inputs.tier && format('call-{0}', github.run_id) || github.event_name == 'pull_request' && format('pr-{0}', github.head_ref) || github.event_name == 'push' && 'main' || format('dispatch-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Classifies the event into one tier, then reads ci/tiers.toml for the jobs
  # and matrix rows that tier runs in this workflow (CI_WORKFLOW). ci.yml,
  # macos.yml and windows.yml carry identical copies; ci/tiers.toml describes
  # each tier and lists every job.
  #   release, extended  release.yml's call (its tier input), or a dispatch
  #         with focus=extended.
  #   native-gui  a dispatch with focus=native-gui.
  #   main  a push, a full dispatch, the ci:full label (added before a push or
  #         a rerun), a change under FULL_PATHS (the compilers, their specs and
  #         runtime, the stdlib modules btrcc imports, the CI hotspots), or a
  #         pull request too large to list.
  #   docs  Markdown that no test or tool reads.
  #   lane  any other change on a codex/* branch.
  #   pr    any other pull request; its changed paths select its shards.
  # Labels and files are read through the API rather than the event payload,
  # so "Re-run all jobs" sees a label added after the push ("Re-run failed
  # jobs" keeps this job's earlier result).
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tier: ${{ steps.classify.outputs.tier }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Classify the change
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TIER: ${{ inputs.tier }}
          FOCUS: ${{ inputs.focus }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          FULL_PATHS: '^(src/(compiler|language|runtime)/|tools/compiler_codegen/|src/stdlib/[A-Za-z0-9]+\.btrc$|src/stdlib/(BackgroundJobs|Digest|FileSystem)/|\.github/workflows/(ci|macos|windows|release)\.yml$|ci/tiers\.toml$|Makefile$|flake\.(nix|lock)$|nix/|src/tests/(conftest|runner_capabilities)\.py$|tools/(native_plan|budget_bench)\.py$)'
          TEST_READ_MARKDOWN: '^(PLAN|AGENTS|CLAUDE)\.md$|(^|/)README\.md$|^docs/design/(native-ui-parity|platform-parity|native-ui-api-inventory|compiler-structure|btrsmith-rename-table-w2|plan-reference|platform-toolchain-matrix)\.md$'
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          mkdir -p build
          : > build/changed-files.txt
          classify() {
            if [ -n "$TIER" ]; then
              echo "$TIER"
              return
            elif [ "$EVENT" = workflow_dispatch ]; then
              case "${FOCUS:-full}" in
                full) echo main ;;
                *) echo "$FOCUS" ;;
              esac
              return
            elif [ "$EVENT" != pull_request ]; then
              echo main
              return
            fi
            pull=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST")
            if jq -e 'any(.labels[]; .name == "ci:full")' <<<"$pull" >/dev/null; then
              echo main
              return
            fi
            pages=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST/files?per_page=100")
            # The files endpoint lists at most 3,000 files; an unlisted one could be anything.
            if [ "$(jq 'map(length) | add // 0' <<<"$pages")" -ne "$(jq '.changed_files' <<<"$pull")" ]; then
              echo main
              return
            fi
            # A rename counts at both paths.
            names=$(jq -r '.[][] | .filename, (.previous_filename // empty)' <<<"$pages")
            printf '%s\n' "$names" > build/changed-files.txt
            if grep -Eq "$FULL_PATHS" <<<"$names"; then
              echo main
            elif ! grep -Evq '\.md$' <<<"$names" && ! grep -Eq "$TEST_READ_MARKDOWN" <<<"$names"; then
              echo docs
            elif [[ "$HEAD_REF" == codex/* ]]; then
              echo lane
            else
              echo pr
            fi
          }
          tier=$(classify)
          case "$tier" in
            docs | pr | lane | main | extended | release | native-gui) ;;
            *) echo "::error::unknown tier: $tier"; exit 1 ;;
          esac
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "Tier: \`$tier\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Plan the tier's jobs
        id: plan
        env:
          TIER: ${{ steps.classify.outputs.tier }}
        run: |
          set -euo pipefail
          plan=$(python3 -m tools.qualification tiers --workflow "$CI_WORKFLOW" --tier "$TIER" --changed build/changed-files.txt)
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          jq -r '"Jobs: " + (.jobs | join(", ")), (.matrix | to_entries[] | "\(.key): \(.value.include | length) row(s)")' <<<"$plan" >> "$GITHUB_STEP_SUMMARY"

  # The static gates: generated sources, lint and format. The naming contract
  # also runs because it reads every tracked Markdown file, so a document can
  # fail it. The main, extended and release tiers get the lint and format gates
  # from the release job instead; the lane tier runs both jobs, because a light
  # lane plan (CL-R-50) would otherwise never run the naming contract.
  static:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.plan).jobs, 'static')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: DeterminateSystems/determinate-nix-action@c70cb8ae92d68c66953db28a26a63db1665bc837 # v3.21.5
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false
      - run: nix develop --command make NIX= generated-check lint format-check
      - run: nix develop --command python3 -m pytest -q -rs src/tests/btrc/test_naming_convention_contract.py --skip-report=build/skip-report-static.json
      - name: Retain the skip report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skip-report-ci-static
          path: build/skip-report*.json
          if-no-files-found: warn
          retention-days: 14

  release:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.plan).jobs, 'release')
    runs-on: ubuntu-latest
    steps:
      # Pin action implementations by commit so moving tags cannot alter CI.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: DeterminateSystems/determinate-nix-action@c70cb8ae92d68c66953db28a26a63db1665bc837 # v3.21.5
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false

      - run: nix flake check --no-build
      - run: nix develop --command make NIX= generated-check
      - run: nix build .#btrc .#btrc-lsp .#btrc-vscode-extension .#checks.x86_64-linux.gpu-runtime-package .#checks.x86_64-linux.native-package-plan --no-link
      - run: make devcontainer
      - run: chmod -R a+w .
      - run: podman run --rm --init -v "$PWD:/workspace" btrc-devcontainer:latest make NIX= lint format-check
      - run: podman run --rm --init -v "$PWD:/workspace" btrc-devcontainer:latest make NIX= package extension
      - run: podman run --rm --init -v "$PWD:/workspace" btrc-devcontainer:latest make NIX= btrcc-linux-x64
      - name: Run the relocatable Linux x64 compiler bundle
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          unset BTRC_HOME
          (cd dist && sha256sum -c btrcc-linux-x64.tar.gz.sha256)
          source="$GITHUB_WORKSPACE/src/tests/strings/BracesInCodeGen.btrc"
          expected="$GITHUB_WORKSPACE/src/tests/strings/expected/BracesInCodeGen.stdout"
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          tar -xzf dist/btrcc-linux-x64.tar.gz -C "$work"
          compiler="$work/btrcc-linux-x64/bin/btrcc"
          expected_stdlib="$work/btrcc-linux-x64/share/btrc/stdlib"
          run="$work/run"
          mkdir "$run"
          actual_stdlib=$(cd "$run" && "$compiler" --stdlib-dir)
          test "$actual_stdlib" = "$expected_stdlib"
          (cd "$run" && "$compiler" "$source") > "$run/program.c"
          cc -std=c11 -pedantic-errors -Wall -Wextra -Werror -O2 \
            "$run/program.c" -o "$run/program" -lm -lpthread
          (cd "$run" && ./program) > "$run/program.stdout"
          cmp "$run/program.stdout" "$expected"
      - name: Retain the Linux x64 release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: btrcc-linux-x64
          path: |
            dist/btrcc-linux-x64.tar.gz
            dist/btrcc-linux-x64.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      # The generator's own check names every generated source, so a new one
      # needs no list here; a clean tree rules out any other tracked mutation.
      - name: Verify release builds did not mutate tracked or generated sources
        run: |
          nix develop --command make NIX= generated-check
          git status --porcelain --untracked-files=all
          test -z "$(git status --porcelain --untracked-files=all)"

  # The suite is split into independent shards that run as parallel jobs on
  # four-core runners; each builds the devcontainer from the Nix cache (about
  # two minutes) and the self-host compiler once. ci/tiers.toml lists the
  # shards: in the main tier they cover exactly what `make test` and `make
  # test-c11` cover. A pr-tier corpus row carries pytest_addopts, which
  # selects the corpus directories its change touched.
  tests:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.plan).jobs, 'tests')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.plan).matrix.tests }}
    name: tests (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: DeterminateSystems/determinate-nix-action@c70cb8ae92d68c66953db28a26a63db1665bc837 # v3.21.5
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false
      - run: make devcontainer
      - run: chmod -R a+w .
      # Each pytest worker also runs native compilers. Keep the four-core
      # runner within its real CPU/memory envelope and allow one slow
      # self-host transpile to make progress under shared load. The init owner
      # reaps daemon-test grandchildren after process-group termination.
      # The runner has no display or GPU: tools/virtual-display.sh starts Xvfb
      # and selects Mesa's software Vulkan (lavapipe), so the Linux GUI and
      # WebGPU adapter tests run here instead of skipping.
      - run: podman run --rm --init -v "$PWD:/workspace" -e PYTEST_ADDOPTS btrc-devcontainer:latest tools/virtual-display.sh make NIX= PYTEST_WORKERS=4 BTRC_TEST_TRANSPILE_TIMEOUT=600 BTRC_TEST_RUN_TIMEOUT=60 ${{ matrix.target }}
        env:
          PYTEST_ADDOPTS: ${{ matrix.pytest_addopts }}
      # The bootstrap shard's boundary-check writes build/boundary-report.json;
      # the release bundle ingests it.
      - name: Retain the boundary report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boundary-report-ci-tests-${{ matrix.shard }}
          path: build/boundary-report.json
          if-no-files-found: ignore
          retention-days: 14
      # Every pytest session classifies its skips in build/skip-report*.json.
      # Keep the report even from a failed shard, so a red run's coverage is
      # as visible as a green one's.
      - name: Retain the skip report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skip-report-ci-tests-${{ matrix.shard }}
          path: build/skip-report*.json
          if-no-files-found: warn
          retention-days: 14

  # A shard whose runner is lost (one c11 job died with no log at all) never
  # reaches its `if: always()` upload, and the run's artifact list just lacks
  # its report. This job runs after every shard, whatever their outcome, and
  # names each report the plan expected from the tests job that is missing,
  # so missing coverage shows as a warning on the run rather than as an
  # absent artifact. The names come from the plan, not the run's job list,
  # because release.yml's calls prefix every job name. A run a newer push
  # cancelled is skipped: its shards never had the chance to upload.
  skip-reports:
    needs: [scope, tests]
    if: ${{ !cancelled() && needs.scope.result == 'success' && contains(fromJSON(needs.scope.outputs.plan).jobs, 'tests') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - name: Name every report the test shards left missing
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED: ${{ join(fromJSON(needs.scope.outputs.plan).reports.tests, ' ') }}
        run: |
          artifacts=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].name')
          test -n "$EXPECTED"
          missing=0
          for name in $EXPECTED; do
            if ! grep -qx "$name" <<<"$artifacts"; then
              echo "::warning::no $name artifact; that shard's evidence is missing"
              echo "- $name: missing" >> "$GITHUB_STEP_SUMMARY"
              missing=$((missing + 1))
            fi
          done
          echo "$missing expected report(s) missing"

  bench:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.plan).jobs, 'bench')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: DeterminateSystems/determinate-nix-action@c70cb8ae92d68c66953db28a26a63db1665bc837 # v3.21.5
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false
      - run: make devcontainer
      - run: chmod -R a+w .
      # The suite measures compile time, startup, emitted-C size, cc time,
      # generated-code speed and compile peaks against the tracked
      # linux-x86_64 baseline, which was recorded from this job's own
      # results.json (`python3 -m tools.bench baseline --results`); re-record
      # it the same way from a green run's artifact when an intended change
      # moves a size or a peak. --strict fails if that baseline is missing.
      # Timings are reported, not gated: ubuntu-latest is a pool of unlike
      # machines (one timing spread 2.15x across runs of one tree), while
      # sizes, lines, parity and peaks repeat and gate. Three samples per
      # timing keep the job short.
      - run: podman run --rm --init -v "$PWD:/workspace" btrc-devcontainer:latest make NIX= bench-check BENCH_ARGS="--repeat 3 --strict --timings report"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results
          path: build/bench/results.json

  linux-arm64-bundle:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.plan).jobs, 'linux-arm64-bundle')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: DeterminateSystems/determinate-nix-action@c70cb8ae92d68c66953db28a26a63db1665bc837 # v3.21.5
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false

      - name: Build and run the native Linux arm64 release archive
        run: |
          test "$(uname -m)" = aarch64
          nix develop --command make NIX= btrcc-linux-arm64
          # The quoted script is expanded by the nested Bash, not this shell.
          # shellcheck disable=SC2016
          nix develop --command bash -euo pipefail -c '
            test "$(uname -m)" = aarch64
            unset BTRC_HOME
            (cd dist && sha256sum -c btrcc-linux-arm64.tar.gz.sha256)
            source="$GITHUB_WORKSPACE/src/tests/strings/BracesInCodeGen.btrc"
            expected="$GITHUB_WORKSPACE/src/tests/strings/expected/BracesInCodeGen.stdout"
            work=$(mktemp -d)
            trap '\''rm -rf "$work"'\'' EXIT
            tar -xzf dist/btrcc-linux-arm64.tar.gz -C "$work"
            compiler="$work/btrcc-linux-arm64/bin/btrcc"
            expected_stdlib="$work/btrcc-linux-arm64/share/btrc/stdlib"
            run="$work/run"
            mkdir "$run"
            actual_stdlib=$(cd "$run" && "$compiler" --stdlib-dir)
            test "$actual_stdlib" = "$expected_stdlib"
            (cd "$run" && "$compiler" "$source") > "$run/program.c"
            cc -std=c11 -pedantic-errors -Wall -Wextra -Werror -O2 \
              "$run/program.c" -o "$run/program" -lm -lpthread
            (cd "$run" && ./program) > "$run/program.stdout"
            cmp "$run/program.stdout" "$expected"
          '
      - name: Retain the Linux arm64 release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: btrcc-linux-arm64
          path: |
            dist/btrcc-linux-arm64.tar.gz
            dist/btrcc-linux-arm64.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # The focused native-GUI gate (`gh workflow run ci.yml -f focus=native-gui`):
  # `make test-native-gui` in the devcontainer, under the virtual display and
  # software Vulkan the tests shards use. It keeps its JUnit results beside
  # the skip report, so a GUI run's pass and skip counts survive without
  # rerunning it.
  native-gui:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.plan).jobs, 'native-gui')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: DeterminateSystems/determinate-nix-action@c70cb8ae92d68c66953db28a26a63db1665bc837 # v3.21.5
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false
      - run: make devcontainer
      - run: chmod -R a+w .
      - run: podman run --rm --init -v "$PWD:/workspace" -e PYTEST_ADDOPTS=--junitxml=build/junit/native-gui.xml btrc-devcontainer:latest tools/virtual-display.sh make NIX= PYTEST_WORKERS=4 BTRC_TEST_TRANSPILE_TIMEOUT=600 BTRC_TEST_RUN_TIMEOUT=60 test-native-gui
      - name: Retain the JUnit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-ci-native-gui
          path: build/junit/native-gui.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Retain the skip report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skip-report-ci-native-gui
          path: build/skip-report*.json
          if-no-files-found: warn
          retention-days: 14

  # The Linux GUI and audio shard (PLAN Stage 31, qualification-ci-linux-gui-audio):
  # `make test-shard-gui` once per display protocol, each inside its own
  # tools/ui/headless-session.sh session (Xvfb, or weston's headless backend)
  # with lavapipe as the GPU adapter and the null ALSA PCM as the sound card.
  # Unlike the native-gui job it runs on every push, and under Wayland too.
  # Each row keeps its session's AT-SPI dump, the native-shell ledgers, the
  # shell and restore logs pytest left, and its JUnit results.
  linux-gui:
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.plan).jobs, 'linux-gui')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.plan).matrix['linux-gui'] }}
    name: linux-gui (${{ matrix.session }})
    # ci/tiers.toml marks a row report-only while its session is not yet stable.
    continue-on-error: ${{ matrix.report_only == 'true' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: DeterminateSystems/determinate-nix-action@c70cb8ae92d68c66953db28a26a63db1665bc837 # v3.21.5
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false
      - run: make devcontainer
      - run: chmod -R a+w .
      - run: podman run --rm --init -v "$PWD:/workspace" btrc-devcontainer:latest make NIX= PYTEST_WORKERS=4 BTRC_TEST_TRANSPILE_TIMEOUT=600 BTRC_TEST_RUN_TIMEOUT=60 GUI_SESSION=${{ matrix.session }} test-shard-gui
      - name: Retain the session evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gui-evidence-ci-linux-gui-${{ matrix.session }}
          path: |
            build/linux-gui/${{ matrix.session }}/atspi.json
            build/ui-shell/
            build/linux-gui/${{ matrix.session }}/pytest/**/*.stdout
            build/linux-gui/${{ matrix.session }}/pytest/**/*.stderr
            build/linux-gui/${{ matrix.session }}/pytest/**/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retain the JUnit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-ci-linux-gui-${{ matrix.session }}
          path: build/linux-gui/${{ matrix.session }}/junit.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Retain the skip report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skip-report-ci-linux-gui-${{ matrix.session }}
          path: build/skip-report*.json
          if-no-files-found: warn
          retention-days: 14
