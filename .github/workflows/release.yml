name: Release

# One release dispatch runs every hosted job of every tier (.github/ci/tiers.toml's
# release tier) across ci.yml, macos.yml and windows.yml. A v* tag does the same;
# the nightly schedule runs the extended tier.
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: Which tier to run
        type: choice
        options: [release, extended]
        default: release

permissions:
  contents: read

# Release runs of one ref queue behind each other; nothing cancels them.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Each call carries the most its jobs need: scope reads pull requests and
  # may read commit statuses, and skip-reports lists the run's artifacts.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read
      statuses: read
      actions: read
    with:
      tier: ${{ github.event_name == 'schedule' && 'extended' || inputs.tier || 'release' }}

  macos:
    uses: ./.github/workflows/macos.yml
    permissions:
      contents: read
      pull-requests: read
      statuses: read
      actions: read
    with:
      tier: ${{ github.event_name == 'schedule' && 'extended' || inputs.tier || 'release' }}

  windows:
    uses: ./.github/workflows/windows.yml
    permissions:
      contents: read
      pull-requests: read
      statuses: read
      actions: read
    with:
      tier: ${{ github.event_name == 'schedule' && 'extended' || inputs.tier || 'release' }}
