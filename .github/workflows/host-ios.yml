name: Host iOS

# CX-P1-04's iOS simulator test host (tools/target_hosts/ios) on a hosted
# macos-15 runner: twelve strict-C11 fixtures, each launched through simctl
# spawn and as an installed app, on an iPhone and an iPad simulator, plus one
# repeated app run per device class (50 executions). The runner's Xcode is
# stand-in provenance, not the owner's pinned 27A266a, and the runtime is the
# newest installed iOS >= 17, not the iOS 17 floor (MAC-P1-02). Until the tool
# directory is on the revision being tested, the tooling job reports it absent
# and the simulator job is skipped, so this workflow can land before the host.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/host-ios.yml
      - tools/target_hosts/ios/**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/host-ios.yml
      - tools/target_hosts/ios/**
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels the run it supersedes; runs on main
# queue rather than cancel.
concurrency:
  group: host-ios-${{ github.event_name == 'pull_request' && format('pr-{0}', github.head_ref) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: check
        run: |
          if [ -f tools/target_hosts/ios/spike.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::tools/target_hosts/ios is not on this revision; the simulator job is skipped."
          fi

  simulator:
    needs: tooling
    if: needs.tooling.outputs.present == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    # An explicit bash shell runs with pipefail, so a failing command piped
    # into tee still fails its step.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Record the Xcode and simulator inventory
        run: |
          mkdir -p build/ios-results
          xcodebuild -version | tee build/ios-results/xcode-version.txt
          xcrun simctl list -j > build/ios-results/simctl-list.json
      - name: Local host tests
        run: python3 -m unittest tools.target_hosts.ios.test_executor -v 2>&1 | tee build/ios-results/unittest.log
      - name: Build the fixtures
        id: build
        run: python3 -m tools.target_hosts.ios.spike build build/ios-testhost 2>&1 | tee build/ios-results/build.log
      # Each device class and mode runs even when an earlier one failed, so a
      # single run records every result; each stops at its own first failure.
      - name: iPhone, simctl spawn
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 -m tools.target_hosts.ios.spike run build/ios-testhost build/ios-results --device-class iphone --mode spawn 2>&1 | tee build/ios-results/iphone-spawn.log
      - name: iPhone, installed app
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 -m tools.target_hosts.ios.spike run build/ios-testhost build/ios-results --device-class iphone --mode app 2>&1 | tee build/ios-results/iphone-app.log
      - name: iPad, simctl spawn
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 -m tools.target_hosts.ios.spike run build/ios-testhost build/ios-results --device-class ipad --mode spawn 2>&1 | tee build/ios-results/ipad-spawn.log
      - name: iPad, installed app
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 -m tools.target_hosts.ios.spike run build/ios-testhost build/ios-results --device-class ipad --mode app 2>&1 | tee build/ios-results/ipad-app.log
      - name: Retain the results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-host-results
          path: build/ios-results
          if-no-files-found: warn
          retention-days: 30
