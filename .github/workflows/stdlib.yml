name: Strict stdlib

on:
  push:
    branches: [main]
    paths:
      - src/**
      - .github/ci/**
      - tools/**
      - nix/**
      - flake.*
      - Makefile
      - .github/workflows/stdlib.yml
  pull_request:
    branches: [main]
    paths:
      - src/**
      - .github/ci/**
      - tools/**
      - nix/**
      - flake.*
      - Makefile
      - .github/workflows/stdlib.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stdlib-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: DeterminateSystems/determinate-nix-action@c70cb8ae92d68c66953db28a26a63db1665bc837 # v3.21.5
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false
      - name: Root the development shell
        run: nix develop --profile "$RUNNER_TEMP/stdlib-dev-shell" --command true
      # First-party code and the target's own system only; wgpu-native is the
      # one exception. A failure names the module, the target and the dependency.
      - name: Refuse third-party requirements
        run: nix develop --command make NIX= stdlib-dependencies
